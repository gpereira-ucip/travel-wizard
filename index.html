<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Travel Wizard</title>
<meta name="description" content="Armá tu viaje en minutos: itinerario día por día, reservas, alertas, valijas y presupuesto en una sola app.">
<meta property="og:type" content="website">
<meta property="og:title" content="Travel Wizard · Tu viaje armado en minutos">
<meta property="og:description" content="Armá tu viaje en minutos: itinerario día por día, reservas, alertas, valijas y presupuesto en una sola app.">
<link rel="icon" id="favIcon" type="image/svg+xml" href="data:,">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#14213d; --night2:#1f3160; --gold:#e0a84f; --gold2:#f4d38f; --coral:#e76f51; --teal:#2a9d8f;
  --bg:#faf7f2; --bg2:#f2ece1; --card:#ffffff; --ink:#1f2933; --muted:#607080; --line:#e6dfd3;
  --ok:#2a9d8f; --warn:#d98a1f; --bad:#c8553d;
  --r1:10px; --r2:18px; --r3:26px;
  --sh1:0 4px 14px rgba(20,33,61,.06); --sh2:0 12px 32px rgba(20,33,61,.12);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#0e1525; --bg2:#152038; --card:#18233b; --ink:#eef1f6; --muted:#9aa7bb; --line:#26344f;
  --sh1:0 4px 14px rgba(0,0,0,.3); --sh2:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

/* top bar */
.top{position:sticky;top:0;z-index:40;padding-top:var(--safe-t);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.2px;font-size:17px;background:none;border:0;padding:0}
.brand svg{width:32px;height:32px;filter:drop-shadow(0 2px 6px rgba(20,33,61,.25))}
[data-theme=dark] .brand .lg-disc{fill:#1f3160}
[data-theme=dark] .brand .lg-ring{opacity:1}
.twlogo .lg-needle{transform-box:view-box;transform-origin:50% 50%}
.brand:hover .lg-needle{animation:wobble 1.2s ease-in-out}
@keyframes wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg)}60%{transform:rotate(8deg)}}
/* portada animada (mejora 8) */
.stars .tw{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
.shoot{position:absolute;top:18%;left:-20%;width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;transform:rotate(-18deg);animation:shoot 9s ease-in 2.5s infinite;pointer-events:none}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-18deg)}2%{opacity:1}9%{opacity:0;transform:translate(520px,-170px) rotate(-18deg)}100%{opacity:0;transform:translate(520px,-170px) rotate(-18deg)}}
.hero-logo{position:absolute;top:22px;right:16px;width:92px;height:92px;opacity:.95;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));animation:logoIn 1.4s cubic-bezier(.2,.8,.2,1) both}
.hero-logo .lg-needle{animation:needleIn 2.2s cubic-bezier(.3,1.5,.4,1) .2s both}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-40deg)}to{opacity:.95;transform:none}}
@keyframes needleIn{from{transform:rotate(-540deg)}to{transform:rotate(0)}}
.hero .wrap>.eyebrow,.hero h1,.hero .wrap>p{position:relative}
.hero h1,.hero .wrap>p,.hero .wrap>.eyebrow{padding-right:0}
@media (max-width:640px){.hero-logo{width:54px;height:54px;top:-36px;right:14px}}
@media (min-width:900px){.hero-logo{width:124px;height:124px;top:6px}}
.nextfeat{position:relative;display:block;width:100%;margin:22px 0 4px;border:1px solid rgba(255,255,255,.18);border-radius:22px;overflow:hidden;min-height:150px;padding:0;text-align:left;color:#fff;background:linear-gradient(135deg,#1f3160,#2a9d8f);background-size:cover;background-position:center;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:riseIn .6s .1s both}
.nextfeat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,35,.05) 10%,rgba(10,16,35,.88))}
.nextfeat .nf{position:relative;display:flex;align-items:flex-end;gap:14px;padding:16px;min-height:150px}
.nextfeat .nf-cd{flex:none;width:72px;height:72px;border-radius:18px;background:rgba(20,33,61,.72);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;border:1px solid rgba(244,211,143,.4)}
.nextfeat .nf-cd b{font-family:var(--serif);font-size:32px;color:var(--gold2)}
.nextfeat .nf-cd span{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#c9d3e6;margin-top:3px}
.nextfeat i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2)}
.nextfeat h3{font-family:var(--serif);font-size:26px;line-height:1.05;margin:2px 0 3px;font-weight:600}
.nextfeat small{color:#dfe6f2;font-size:12px}
.nextfeat .nf-go{position:absolute;top:12px;right:12px;font-size:12px;font-weight:800;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 10px}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* pantalla de carga del mago (mejora 9) */
.gcomp{width:132px;height:132px;position:relative}
.gcomp::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 35%,transparent),transparent 70%);animation:pulse 2.4s ease-in-out infinite}
.gcomp svg{position:relative;width:100%;height:100%}
.gcomp .lg-needle{animation:seek 3.2s cubic-bezier(.45,0,.2,1) infinite}
@keyframes seek{0%{transform:rotate(0)}35%{transform:rotate(200deg)}55%{transform:rotate(160deg)}75%{transform:rotate(370deg)}100%{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.gen h2{font-family:var(--serif);font-size:30px;line-height:1.1;margin:0;font-weight:600}
.gbar{width:100%;max-width:340px;height:8px;border-radius:8px;background:var(--bg2);overflow:hidden}
.gbar i{display:block;height:100%;width:4%;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .6s ease}
.gfact{width:100%;max-width:420px;min-height:132px;border-radius:var(--r2);padding:16px 18px;text-align:left;position:relative;overflow:hidden;color:#fff;background:linear-gradient(140deg,var(--night),var(--night2));background-size:cover;background-position:center;box-shadow:var(--sh2)}
.gfact::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,35,.35),rgba(10,16,35,.9))}
.gfact>*{position:relative}
.gfact .gk{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2)}
.gfact p{margin:6px 0 4px;font-size:15px;line-height:1.45;transition:opacity .35s}
.gfact small{font-size:11px;color:#c9d3e6}
.gfact.fade p,.gfact.fade small{opacity:0}
@media (prefers-reduced-motion:reduce){.stars .tw,.shoot,.hero-logo,.hero-logo .lg-needle,.nextfeat,.gcomp::before,.gcomp .lg-needle,.brand:hover .lg-needle{animation:none!important}.shoot{display:none}}
.brand span b{color:var(--gold)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px}
/* theme switch */
.switch{position:relative;width:54px;height:30px;border-radius:30px;border:1px solid var(--line);background:var(--bg2);padding:0}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--gold);transition:transform .3s;display:grid;place-items:center;font-style:normal;font-size:12px}
[data-theme=dark] .switch i{transform:translateX(24px);background:var(--night2)}

/* home */
.hero{position:relative;border-radius:0 0 var(--r3) var(--r3);overflow:hidden;background:radial-gradient(1200px 400px at 80% -10%,#3b5998 0%,transparent 60%),linear-gradient(160deg,var(--night) 0%,#0b1430 100%);color:#fff;padding:46px 0 40px}
.hero .stars{position:absolute;inset:0;opacity:.6;pointer-events:none}
.hero h1{font-family:var(--serif);font-size:44px;line-height:1.05;margin:6px 0 10px;font-weight:600}
.hero h1 em{color:var(--gold2)}
.hero p{color:#c9d3e6;max-width:520px;margin:0 0 22px}
.eyebrow{text-transform:uppercase;letter-spacing:2.4px;font-size:11px;font-weight:700;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--gold);color:#1b1b1b;box-shadow:var(--sh1);transition:transform .12s,filter .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.dark{background:var(--night);color:#fff}
[data-theme=dark] .btn.dark{background:var(--night2)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.feat div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;font-size:12px;color:#dfe6f3}
.feat b{display:block;font-size:18px}
h2.sec{font-family:var(--serif);font-size:28px;font-weight:600;margin:28px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh1)}
.tripcard{display:flex;gap:14px;padding:14px;margin-bottom:12px;align-items:center;cursor:pointer}
.tripcard .ph{width:64px;height:64px;border-radius:14px;flex:none;background:linear-gradient(135deg,var(--night2),var(--teal));display:grid;place-items:center;font-size:28px;background-size:cover;background-position:center}
.tripcard h3{margin:0;font-size:16px}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* wizard */
.wz{min-height:calc(100vh - 58px);display:flex;flex-direction:column}
.prog{height:5px;background:var(--bg2);border-radius:5px;overflow:hidden;margin:16px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .35s}
.stepn{font-size:12px;color:var(--muted);font-weight:600}
.wz h2{font-family:var(--serif);font-size:32px;line-height:1.1;margin:10px 0 4px;font-weight:600}
.wz .lead{color:var(--muted);margin:0 0 18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);outline:none;font-size:16px}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.sugg{position:relative}
.sugg ul{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh2);z-index:30;max-height:260px;overflow:auto}
.sugg li{padding:10px 10px;border-radius:9px;cursor:pointer}
.sugg li:hover,.sugg li.on{background:var(--bg2)}
.stop{display:flex;align-items:center;gap:10px;padding:12px 12px;margin-bottom:8px}
.stop .num{width:28px;height:28px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-weight:800}
.stepper b{min-width:22px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;transition:transform .1s;user-select:none}
.chip.on{background:var(--night);border-color:var(--night);color:#fff}
[data-theme=dark] .chip.on{background:var(--gold);border-color:var(--gold);color:#1b1b1b}
.chip.lg{padding:12px 16px;font-size:15px}
.trav{display:flex;gap:8px;align-items:center;padding:10px;margin-bottom:8px;flex-wrap:wrap}
.trav input{flex:1;min-width:120px}
.trav select{padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--bg2)}
.x{border:0;background:none;color:var(--muted);font-size:20px;width:34px;height:34px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.level{padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.level.on{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.level b{display:block;font-size:16px}
.level span{font-size:12px;color:var(--muted)}
.wznav{position:sticky;bottom:0;padding:14px 0 calc(14px + var(--safe-b));margin-top:auto;display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 30%)}
.note{font-size:13px;color:var(--muted);background:var(--bg2);border-radius:12px;padding:10px 12px;margin:10px 0}

/* generating */
.gen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.orb{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--gold),var(--coral),var(--teal),var(--night2),var(--gold));animation:spin 2.2s linear infinite;display:grid;place-items:center}
.orb::after{content:"";width:86px;height:86px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.genlog{list-style:none;padding:0;margin:0;font-size:14px;color:var(--muted);text-align:left}
.genlog li{padding:3px 0}
.genlog li.ok::before{content:"✓ ";color:var(--ok);font-weight:800}
.genlog li.run::before{content:"… ";color:var(--gold);font-weight:800}

/* trip */
.thero{position:relative;min-height:230px;color:#fff;display:flex;align-items:flex-end;background:linear-gradient(160deg,var(--night),#0b1430);background-size:cover;background-position:center;border-radius:0 0 var(--r3) var(--r3);overflow:hidden}
.thero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,35,.15),rgba(10,16,35,.85))}
.thero .wrap{position:relative;width:100%;padding-bottom:20px;padding-top:30px}
.thero h1{font-family:var(--serif);font-size:38px;line-height:1.05;margin:4px 0 8px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.tab{border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tab .ic{font-size:20px;line-height:1}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.tab .badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--coral);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;min-width:16px}
.page{padding-bottom:110px}
.wx{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.wx::-webkit-scrollbar{display:none}
.wxd{flex:none;width:76px;text-align:center;padding:10px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px}
.wxd .e{font-size:24px}
.wxd b{display:block;font-size:14px}
#map{height:260px;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);margin:8px 0 6px;z-index:1}
.day{margin:18px 0;overflow:hidden}
.dayh{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--night) 92%,transparent),color-mix(in srgb,var(--night2) 92%,transparent));color:#fff}
.dayh .dn{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1;color:var(--gold2)}
.dayh h3{margin:0;font-size:16px}
.dayh .w{margin-left:auto;text-align:right;font-size:12px;opacity:.95}
.dayh .w b{font-size:18px}
.items{padding:6px 12px 12px}
.it{display:flex;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line);align-items:flex-start}
.it:last-child{border-bottom:0}
.it .tm{width:46px;flex:none;font-weight:800;font-size:13px;color:var(--muted);padding-top:2px}
.it .im{width:74px;height:74px;flex:none;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:30px;background-size:cover;background-position:center}
.it h4{margin:0 0 2px;font-size:15px;line-height:1.3}
.it p{margin:2px 0 6px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.it.done h4{text-decoration:line-through;opacity:.6}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--muted)}
.tag.cost{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal)}
.tag.rsv{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}
.acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.acts button,.acts a{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:4px 9px;font-size:12px;font-weight:600;text-decoration:none;color:var(--ink)}
.it.bkit{background:color-mix(in srgb,var(--coral) 6%,transparent);border-radius:12px;border-bottom:0;margin:4px 0}
.it.travel{background:color-mix(in srgb,var(--teal) 7%,transparent);border-radius:12px;border-bottom:0;margin:4px 0}
.srcnote{font-size:12px;color:var(--muted);margin:6px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.list{padding:4px 14px}
.bk{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.bk:last-child{border-bottom:0}
.bk .ico{width:44px;height:44px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:22px;flex:none}
.bk h4{margin:0;font-size:15px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.links a{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:13px;background:var(--bg)}
.subh{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 0 8px}
.al{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.al:last-child{border-bottom:0}

};
const idb = {
  db:null,
  async open(){ if(this.db) return this.db; return this.db = await new Promise((res,rej)=>{ try{ const r = indexedDB.open('travelwizard',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); },
  async put(id, blob){ const db=await this.open(); return new Promise((res,rej)=>{const t=db.transaction('files','readwrite'); t.objectStore('files').put(blob,id); t.oncomplete=res; t.onerror=()=>rej(t.error);}); },
  async get(id){ const db=await this.open(); return new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); },
  async del(id){ try{ const db=await this.open(); db.transaction('files','readwrite').objectStore('files').delete(id);}catch(e){} }
};

/* ---------- fechas ---------- */
const D = {
  parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); },
  fmt(dt){ return dt.toISOString().slice(0,10); },
  add(s,n){ const d=D.parse(s); d.setUTCDate(d.getUTCDate()+n); return D.fmt(d); },
  diff(a,b){ return Math.round((D.parse(b)-D.parse(a))/864e5); },
  today(){ const t=new Date(); return D.fmt(new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))); },
  nice(s, opt={weekday:'short',day:'numeric',month:'short'}){ return D.parse(s).toLocaleDateString('es-AR',{...opt,timeZone:'UTC'}); },
};

  {e:'🏰', t:'Praga · Viena · Innsbruck', sub:'Europa central · 9 noches', tag:'Ciudades', bg:'linear-gradient(160deg,#5b2a3c,#c85a32)', stops:[['Praga',4],['Viena',3],['Innsbruck',2]], ints:['historia','cultura','gastronomia']},

];

/* Sponsors (mejoras 21–22). Se cargan acá: {id, brand, title, text, url, cta, emoji, img, where:[home,reservas,valijas,alertas], dest:[...], ints:[...], kids:true/false, from:'YYYY-MM-DD', to:'YYYY-MM-DD'}.
   Mientras no haya sponsors activos se muestra un aviso propio «Tu marca acá». */
const SPONSORS = [];

/* Novedades por versión (mejora 1) */
const NEWS = [
  ['0.6','10 nov 2026',['Logo nuevo: brújula de mago en versión clara, oscura e ícono de app (también como favicon). Se puede descargar desde «Para marcas».','Portada animada: estrellas que titilan, estrella fugaz, la brújula que gira al abrir y tu próximo viaje destacado con foto y cuenta regresiva.','Mientras se arma el viaje: el mago muestra el avance paso a paso con datos curiosos del destino (con internet) y consejos de viaje.']],
  ['0.5','9 nov 2026',['Empieza el plan de 200 mejoras: esta pantalla muestra el avance.','Inicio con ideas de viaje que precargan el asistente y «Mis viajes» con cuenta regresiva.','Resumen del viaje: cuenta regresiva, próximo evento, valijas, reservas y presupuesto.','Editar y duplicar viajes sin rehacerlos.','Espacios para sponsors y página «Para marcas».']],

  ['0.1','6 nov 2026',['Primera versión: asistente, itinerario con fotos, clima y mapa, reservas, alertas, valijas y presupuesto.']],
];
const ROADMAP = {total:200, done:[1,2,3,4,5,6,7,8,9,21,22]};
const BK = {
  vuelo:{e:'✈️',l:'Vuelo'}, tren:{e:'🚆',l:'Tren'}, bus:{e:'🚌',l:'Micro / bus'}, barco:{e:'⛴️',l:'Barco / ferry'},
  hotel:{e:'🏨',l:'Hotel'}, airbnb:{e:'🏠',l:'Airbnb / depto'}, auto:{e:'🚗',l:'Alquiler de auto'},

/* =========================================================
   PROVEEDORES DE DATOS
   ========================================================= */
async function fetchJSON(url, ms=9000){
  const c = new AbortController(); const to = setTimeout(()=>c.abort(), ms);
  try{ const r = await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(to); }
}
async function detectLive(){
  if(LIVE!==null) return LIVE;
  try{ await fetchJSON('https://geocoding-api.open-meteo.com/v1/search?name=Roma&count=1&language=es', 5000); LIVE=true; }
  catch(e){ LIVE=false; }
  return LIVE;
}
async function geocode(q){
  if(!q || q.length<2) return [];
  const j = await fetchJSON('https://geocoding-api.open-meteo.com/v1/search?count=6&language=es&format=json&name='+encodeURIComponent(q));
  return (j.results||[]).map(r=>({name:r.name, country:r.country||'', cc:r.country_code||'', admin:r.admin1||'', lat:r.latitude, lon:r.longitude, pop:r.population||0}));
}
const _wsCache={};
function wikiSummary(title, lang='es'){ const k=lang+'|'+title; return _wsCache[k] || (_wsCache[k]=_wikiSummary(title,lang)); }
async function _wikiSummary(title, lang='es'){
  try{
    const j = await fetchJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
    return {img:(j.originalimage||j.thumbnail||{}).source||'', text:j.extract||'', url:(j.content_urls&&j.content_urls.desktop||{}).page||''};
  }catch(e){ return null; }
}
async function wikiNearby(lat, lon, lang='es'){
  const u = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord=${lat}%7C${lon}&ggsradius=10000&ggslimit=100&prop=pageimages%7Cdescription%7Ccoordinates%7Cinfo&piprop=thumbnail&pithumbsize=400&pilimit=100&colimit=100&inprop=url`;
  const j = await fetchJSON(u, 12000);
  return Object.values((j.query||{}).pages||{}).map(p=>({
    title:p.title, desc:p.description||'', img:(p.thumbnail||{}).source||'', len:p.length||0,
    lat:(p.coordinates&&p.coordinates[0]||{}).lat, lon:(p.coordinates&&p.coordinates[0]||{}).lon,
    url:p.fullurl||`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title)}`, lang
  }));
}
async function wikiExtracts(titles, lang='es'){
  const out={};
  for(let i=0;i<titles.length;i+=20){
    const chunk = titles.slice(i,i+20);
    try{
      const j = await fetchJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&exsentences=2&exlimit=20&titles=${encodeURIComponent(chunk.join('|'))}`);
      Object.values((j.query||{}).pages||{}).forEach(p=>{ if(p.extract) out[p.title]=p.extract; });
    }catch(e){}
  }
  return out;
}
async function weatherFor(stop, start, end){
  const today = D.today();
  const daysAhead = D.diff(today, start);
  const daily = 'weather_code,temperature_2m_max,temperature_2m_min';
  try{
    if(daysAhead >= 0 && D.diff(today,end) <= 15){
      const j = await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${stop.lat}&longitude=${stop.lon}&daily=${daily},precipitation_probability_max,precipitation_sum&timezone=auto&start_date=${start}&end_date=${end}`);
      return {kind:'pronostico', days:j.daily.time.map((t,i)=>({date:t, code:j.daily.weather_code[i], tmax:j.daily.temperature_2m_max[i], tmin:j.daily.temperature_2m_min[i], rain:j.daily.precipitation_sum[i], prob:(j.daily.precipitation_probability_max||[])[i]}))};
    }
    // referencia: mismas fechas del año anterior (o del último año con datos)
    let back = 1; while(D.diff(D.add(end,-365*back), today) < 6) back++;
    const s = D.add(start,-365*back), e = D.add(end,-365*back);
    const j = await fetchJSON(`https://archive-api.open-meteo.com/v1/archive?latitude=${stop.lat}&longitude=${stop.lon}&daily=${daily},precipitation_sum&timezone=auto&start_date=${s}&end_date=${e}`);
    return {kind:'referencia', days:j.daily.time.map((t,i)=>({date:D.add(t,365*back), code:j.daily.weather_code[i], tmax:j.daily.temperature_2m_max[i], tmin:j.daily.temperature_2m_min[i], rain:j.daily.precipitation_sum[i]}))};
  }catch(e){ return null; }
}

/* =========================================================
   MOTOR DEL ITINERARIO
   ========================================================= */
function km(a,b){ if(a.lat==null||b.lat==null) return 3; const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function hasKids(trip){ return trip.travelers.some(t=>t.age==='nino'||t.age==='bebe'); }
function scoreItem(it, trip){
  const w = c => trip.interests.includes(c) ? 3 : (c==='historia'||c==='imperdible'||c==='cultura' ? 1.2 : 0.6);
  let s = Math.max(...it.cats.map(w));
  if(it.len) s *= 1 + Math.log10(Math.max(it.len,1000))/4;
  if(it.img) s += .6;
  if(hasKids(trip) && it.cats.includes('ninos')) s += 2;
  if(hasKids(trip) && it.cats.includes('nocturna')) s -= 2;
  if(it.generic) s *= .55;
  return s;
}
function genericFor(trip, stop){
  const list=[]; const ints = trip.interests.length ? trip.interests : ['historia','gastronomia','cultura'];
  ints.forEach(i => (EXP[i]||[]).forEach(([title,desc,cost,slot,q])=>{
    list.push({id:uid(), title, desc, cats:[i], cost, slot, generic:true, indoor:['gastronomia','shopping','relax','nocturna'].includes(i),
      url: q ? `https://www.getyourguide.com/s/?q=${encodeURIComponent(stop.name+' '+q)}` : '', lat:stop.lat, lon:stop.lon});
  }));
  return list;
}
function buildDays(trip){
  // un día por fecha, de la salida a la vuelta
  const days=[]; let date=trip.start;
  trip.stops.forEach((s,si)=>{
    for(let n=0;n<s.nights;n++){ days.push({date, stop:si, items:[], kind: n===0 ? (si===0?'llegada':'traslado') : 'normal'}); date=D.add(date,1); }
  });
  days.push({date, stop:trip.stops.length-1, items:[], kind:'regreso'});
  return days;
}
function schedule(trip){
  const days = buildDays(trip);
  const maxCost = LEVELS[trip.budget.level].max;
  let cap = PACE[trip.pace].n; if(trip.travelers.some(t=>t.age==='bebe')) cap=Math.max(2,cap-1);
  trip.pool = trip.pool || {};
  trip.stops.forEach((stop, si)=>{
    const pool = (trip.pool[si]||[]).filter(p=>p.cost<=maxCost).map(p=>({...p, score:scoreItem(p,trip)})).sort((a,b)=>b.score-a.score);
    const used = new Set();
    const sd = days.filter(d=>d.stop===si);
    sd.forEach(day=>{
      let n = cap; if(day.kind!=='normal') n = day.kind==='regreso' ? 1 : Math.max(1,cap-2);
      if(day.kind==='regreso' && trip.stops.length && si===trip.stops.length-1){ /* mañana libre antes de volver */ }
      const w = (trip.weather||{})[day.date]; const rainy = isRainy(w);
      const chosen=[];
      for(let k=0;k<n;k++){
        const anchor = chosen[0];
        let best=null, bs=-1e9;
        for(const p of pool){ if(used.has(p.id)) continue;
          let s = p.score; if(anchor) s -= km(anchor,p)*0.5; if(rainy && !p.indoor) s -= 2.5;
          if(chosen.some(c=>c.generic) && p.generic) s -= 3;
          if(s>bs){bs=s;best=p;} }
        if(!best) break; used.add(best.id); chosen.push(best);
      }
      // orden: mañana → tarde → noche
      const ord = {manana:0, mediodia:1, tarde:2, noche:3};
      chosen.sort((a,b)=>(ord[a.slot]??(a.cats.includes('nocturna')?3:1.5))-(ord[b.slot]??(b.cats.includes('nocturna')?3:1.5)));
      const times = day.kind==='normal' ? ({1:['10:00'],2:['10:00','16:00'],3:['09:30','13:30','17:00'],4:['09:00','12:30','16:00','20:30']}[chosen.length]||['10:00'])
                   : day.kind==='regreso' ? ['09:30'] : ({1:['17:00'],2:['16:00','20:00']}[chosen.length]||['17:00']);
      day.items = chosen.map((p,i)=>({ref:p.id, time:times[i]||'', done:false}));
    });
    trip.used = trip.used || {}; trip.used[si] = [...used];
  });
  return days;
}

/* ---------- generación completa ---------- */
async function generate(trip, log){
  trip.pool = {}; trip.weather = {}; trip.source = 'basico'; trip.intro = {};
  const end = D.add(trip.start, trip.stops.reduce((a,s)=>a+s.nights,0));
  const live = await detectLive();
  if(!SAMPLE && window.claude) await initClaude();
  if(live){
    for(const s of trip.stops){ if(s.lat==null){ try{ const g=(await geocode(s.name))[0]; if(g) Object.assign(s,{lat:g.lat,lon:g.lon,country:g.country,cc:g.cc,admin:g.admin}); }catch(e){} } }
    if(trip.origin && !trip.origin.cc && trip.origin.name){ try{ const g=(await geocode(trip.origin.name))[0]; if(g) trip.origin={...g}; }catch(e){} }
    trip.source='web';
    let date = trip.start;
    for(const [si,stop] of trip.stops.entries()){
      log(`Buscando lugares en ${stop.name}…`);
      let raw=[];
      try{ raw = await wikiNearby(stop.lat, stop.lon, 'es'); if(raw.length<25) raw = raw.concat(await wikiNearby(stop.lat, stop.lon, 'en')); }catch(e){}
      const seen=new Set(); const items=[];
      raw.forEach(p=>{ const k=norm(p.title); if(seen.has(k)) return; seen.add(k); const c=classify(p); if(!c) return; items.push({id:uid(), ...p, ...c}); });
      items.sort((a,b)=>b.len-a.len);
      const top = items.slice(0,45);
      const ex = await wikiExtracts(top.filter(i=>i.lang==='es').map(i=>i.title),'es');
      const exEn = await wikiExtracts(top.filter(i=>i.lang==='en').map(i=>i.title),'en');
      top.forEach(i=>{ i.text = ex[i.title]||exEn[i.title]||''; });
      trip.pool[si] = top.concat(genericFor(trip, stop));
      log(`Consultando el clima en ${stop.name}…`);
      const sEnd = D.add(date, stop.nights);
      const w = await weatherFor(stop, date, sEnd);
      if(w){ trip.weatherKind = w.kind; w.days.forEach(d=>{ if(!trip.weather[d.date] || d.date!==sEnd) trip.weather[d.date]={...d, stop:si}; }); }
      if(!stop.img){ const s = await wikiSummary(stop.name,'es'); if(s){ stop.img=s.img; trip.intro[si]=s.text; } }
      date = sEnd;
    }
  } else if(SAMPLE){
    trip.source='claude';
    let date = trip.start;
    for(const [si,stop] of trip.stops.entries()){
      log(`Claude está armando ${stop.name}…`);
      try{
        const v = await claudePlaces(trip, stop, stop.nights);
        trip.intro[si] = v.intro||'';
        const acts = (v.activities||[]).map(a=>({id:uid(), title:a.title, desc:a.area||'', text:a.desc||'', cats:(a.cats||[]).filter(c=>CAT[c]).length?(a.cats||[]).filter(c=>CAT[c]):['imperdible'], cost:Math.max(0,Math.min(3,+a.cost||0)), indoor:!!a.indoor, lat:+a.lat||null, lon:+a.lon||null, len:20000,
          url:`https://www.google.com/maps/search/${encodeURIComponent(a.title+' '+stop.name)}`}));
        if(stop.lat==null && acts[0]){ stop.lat=acts[0].lat; stop.lon=acts[0].lon; }
        trip.pool[si] = acts.concat(genericFor(trip, stop));
        if(v.climate){ for(let i=0;i<=stop.nights;i++){ const d=D.add(date,i); trip.weather[d]={date:d, tmin:v.climate.tmin, tmax:v.climate.tmax, code:null, note:v.climate.note, stop:si}; } trip.weatherKind='tipico'; }
      }catch(e){ console.warn(e); trip.pool[si] = genericFor(trip, stop); }
      date = D.add(date, stop.nights);
    }
  } else {
    trip.stops.forEach((stop,si)=>{ trip.pool[si] = genericFor(trip, stop); });
  }
  log('Distribuyendo actividades día por día…');
  trip.days = schedule(trip);
  log('Armando las valijas…');
  trip.packing = buildPacking(trip);
  trip.end = end;
}

/* =========================================================
   VALIJAS
   ========================================================= */
function tripClimate(trip){
  const ws = Object.values(trip.weather||{});
  if(!ws.length) return null;
  return {tmin:Math.min(...ws.map(w=>w.tmin)), tmax:Math.max(...ws.map(w=>w.tmax)), rain:ws.some(isRainy)};
}
function isIntl(trip){ return trip.origin && trip.origin.cc && trip.stops.some(s=>s.cc && s.cc!==trip.origin.cc); }
function buildPacking(trip){
  const nights = trip.stops.reduce((a,s)=>a+s.nights,0);
  const n = Math.min(nights+1, 7); const wash = nights+1>7;
  const cl = tripClimate(trip); const I = i=>trip.interests.includes(i);
  const intl = isIntl(trip);
  const P = {};
  const add=(who,item,why='')=>{ (P[who]=P[who]||[]).push({id:uid(), item, why, on:false}); };
  trip.travelers.forEach((t,ti)=>{
    const who = t.name || ('Viajero '+(ti+1));
    add(who, intl?'Pasaporte (vigente 6 meses después del regreso)':'DNI', intl?'viaje internacional':'');
    if(t.age==='bebe'){
      add(who, `Pañales (~${(nights+1)*6} + extra)`, '6 por día aprox.');
      ['Toallitas húmedas','Cambiador portátil','Mamadera / vasito','Cochecito o mochila portabebé','Muda extra en el bolso de mano','Chupete de repuesto','Juguete o mantita de apego'].forEach(x=>add(who,x));
      add(who, `${n+2} bodies / remeras`, 'mudas extra');
    } else {
      add(who, `${n} remeras`, wash?'lavar a mitad del viaje':''); add(who, `${n} mudas de ropa interior`); add(who, `${n} pares de medias`);
      add(who, `${Math.ceil(n/3)+1} pantalones`); add(who,'Pijama'); add(who,'Calzado cómodo para caminar');
      add(who,'Cepillo de dientes y neceser');
    }
    if(cl){
      if(cl.tmin<10){ add(who,'Campera de abrigo', `mínimas de ${Math.round(cl.tmin)}°`); add(who,'Gorro, guantes y bufanda'); if(cl.tmin<3) add(who,'Primera capa térmica'); }
      else if(cl.tmin<18) add(who,'Buzo o campera liviana', `mínimas de ${Math.round(cl.tmin)}°`);
      if(cl.tmax>26){ add(who,'Shorts / ropa fresca', `máximas de ${Math.round(cl.tmax)}°`); add(who,'Gorra y anteojos de sol'); }
      if(cl.rain) add(who,'Piloto o campera impermeable','hay días con lluvia');
    }
    if(I('playa')){ add(who,'Malla'); add(who,'Ojotas'); }
    if(I('naturaleza')||I('aventura')){ if(t.age!=='bebe'){ add(who,'Zapatillas de trekking'); add(who,'Botella de agua reutilizable'); } }
    if(I('nocturna') && (t.age==='adulto'||t.age==='mayor')) add(who,'Una muda para salir de noche');
    if(t.age==='nino'){ add(who,'Libro, juego o tablet con auriculares','para traslados'); add(who,'Snacks para el viaje'); }
    if(t.age==='adolescente'){ add(who,'Auriculares y cargador'); }
    if(t.age==='adulto'||t.age==='mayor'){ add(who,'Celular y cargador'); }
    if(t.age==='mayor'){ add(who,'Anteojos de repuesto'); }
  });
  const S = 'Para todo el grupo';
  ['Botiquín básico (curitas, termómetro, gasas, alcohol en gel)','Medicación habitual de cada uno, con receta','Copias digitales de documentos y reservas','Power bank','Bolsas para ropa sucia'].forEach(x=>add(S,x));
  if(cl && cl.tmax>24) add(S,'Protector solar','sol fuerte');
  if(cl && cl.tmax>24 && (I('naturaleza')||I('playa'))) add(S,'Repelente de insectos');
  if(I('playa')) add(S,'Toallones y sombrilla');
  if(intl){ add(S,'Adaptador de enchufe universal','viaje internacional'); add(S,'Seguro de viaje impreso / en el celular'); add(S,'Tarjeta sin comisión en el exterior o algo de efectivo local'); }
  if(I('naturaleza')||I('aventura')) add(S,'Mochila de día');
  if(hasKids(trip)) add(S,'Toallitas y alcohol en gel extra');
  if(wash) add(S,'Jabón para lavar ropa en viaje','viaje de más de una semana');
  return P;
}

   ========================================================= */
const MULT = {adulto:1, mayor:1, adolescente:.85, nino:.6, bebe:.1};
function budgetCalc(trip){
  const days = trip.stops.reduce((a,s)=>a+s.nights,0) || 1;
  const lv = LEVELS[trip.budget.level]; const m = trip.travelers.reduce((a,t)=>a+(MULT[t.age]||1),0);
  const total = Math.round(lv.usd*m*days);
  const split = [['Alojamiento',.4,'#14213d'],['Comidas',.25,'#e0a84f'],['Transporte local',.15,'#2a9d8f'],['Actividades',.2,'#e76f51']];
  const booked = (trip.bookings||[]).filter(b=>b.price && (!b.cur || b.cur===trip.budget.cur)).reduce((a,b)=>a+priceNum(b.price),0);
  return {days, total, split, booked};
}

function buildAlerts(trip){

  add(new Date(start-1*864e5),'📲','Descargar mapas sin conexión y cargar todo','Mapas offline, power bank cargado, reservas en el celular.');
  (trip.bookings||[]).forEach(b=>{
    if(!b.date) return;
    const t = dtOf(b.date, b.time); const lbl = `${BK[b.type].e} ${b.title||BK[b.type].l}${b.code?' · '+b.code:''}`;

      add(new Date(t-24*36e5),'✅','Hacer el check-in online', lbl+' — la mayoría de las aerolíneas lo habilitan 24 a 48 h antes.', b.id);
      add(new Date(t-(intl?3:2)*36e5),'🚕',`Estar en el aeropuerto (${intl?'3':'2'} h antes)`, lbl+(b.from?` · sale de ${b.from}`:''), b.id);
      add(t,'✈️','Sale el vuelo', lbl+(b.from||b.to?` · ${b.from||''} → ${b.to||''}`:''), b.id);
    } else if(['tren','bus','barco'].includes(b.type)){
      add(new Date(t-45*6e4),'🚉','Estar en la estación (45 min antes)', lbl+(b.from?` · ${b.from}`:''), b.id);
      add(t,BK[b.type].e,'Sale '+BK[b.type].l.toLowerCase(), lbl+(b.from||b.to?` · ${b.from||''} → ${b.to||''}`:''), b.id);
    } else if(LODGING.includes(b.type)){
      if(b.type==='airbnb') add(new Date(dtOf(b.date,'10:00')-2*864e5),'💬','Confirmar llegada con el anfitrión', lbl+' — horario de llegada y cómo retirar las llaves.', b.id);
      add(dtOf(b.date, b.time||'15:00'),'🔑','Check-in', lbl+(b.address?` · ${b.address}`:''), b.id);
      if(b.endDate) add(dtOf(b.endDate, b.endTime||'11:00'),'🚪','Check-out', lbl, b.id);
    } else if(b.type==='auto'){
      add(t,'🚗','Retirar el auto', lbl+(b.from?` · ${b.from}`:''), b.id);
      if(b.endDate) add(dtOf(b.endDate,b.endTime||'10:00'),'⛽','Devolver el auto (con tanque lleno)', lbl, b.id);
    } else {
      add(new Date(t-2*36e5),BK[b.type].e, b.title||BK[b.type].l, (b.code?'Código '+b.code+'. ':'')+(b.notes||''), b.id);
    }
  });
  return A.sort((a,b)=>a.when-b.when);
}
function icsDate(d){ return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function buildICS(trip){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Travel Wizard//ES','CALSCALE:GREGORIAN'];
  const e = s => String(s||'').replace(/[,;\\]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  buildAlerts(trip).forEach(a=>{
    L.push('BEGIN:VEVENT','UID:'+uid()+'@travelwizard','DTSTAMP:'+icsDate(new Date()),'DTSTART:'+icsDate(a.when),'DTEND:'+icsDate(new Date(+a.when+30*6e4)),
      'SUMMARY:'+e(a.icon+' '+a.title),'DESCRIPTION:'+e(a.detail),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(a.title),'TRIGGER:-PT15M','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
async function saveFile(filename, text, mime){
  if(DOWNLOADS){ try{ await DOWNLOADS.save({filename, data:new Blob([text],{type:mime})}); return; }catch(e){ if(e && e.code) { toast('No se pudo descargar'); return; } } }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
  catch(e){ toast('Este visor no permite descargas'); }
}
let notifTimers=[];
function scheduleNotifs(trip){
  notifTimers.forEach(clearTimeout); notifTimers=[];
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const now=Date.now();
  buildAlerts(trip).forEach(a=>{ const ms=+a.when-now; if(ms>0 && ms<2147483000) notifTimers.push(setTimeout(()=>{ try{ new Notification(a.icon+' '+a.title,{body:a.detail}); }catch(e){} }, ms)); });
}

function wireSuggest(inp, ul, onPick){
  let tmr, res=[];
  inp.addEventListener('input', ()=>{ clearTimeout(tmr); const q=inp.value.trim(); if(q.length<2){ul.classList.add('hidden');return;}
    tmr=setTimeout(async()=>{
      const live = await detectLive();
      if(live){ try{ res = await geocode(q); }catch(e){ res=[]; } }
      else res = [];
      const manual = {name:q, country:'', cc:'', admin:'', lat:null, lon:null, manual:true};
      const list = res.length ? res : [manual];
      ul.innerHTML = list.map((r,i)=>`<li data-i="${i}"><b>${esc(r.name)}</b> <span class="small muted">${esc([r.admin,r.country].filter(Boolean).join(', ')||(r.manual?'Usar este nombre':''))}</span></li>`).join('');
      ul.classList.remove('hidden');
      $$('li',ul).forEach(li=>li.onclick=()=>{ onPick(list[+li.dataset.i]); ul.classList.add('hidden'); });
    }, 280);
  });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const f=$('li',ul); if(f && !ul.classList.contains('hidden')) f.click(); } });
  inp.addEventListener('blur', ()=>setTimeout(()=>ul.classList.add('hidden'),200));
}
function wireStep(st){

    wireSuggest($('#dest'), $('#destS'), r=>{ wz.stops.push({...r, nights: wz.stops.length? 3 : 4}); renderWizard(); setTimeout(()=>$('#dest')&&$('#dest').focus(),50); });
    $$('#stops [data-d]').forEach(b=>b.onclick=()=>{ const s=wz.stops[+b.dataset.n]; s.nights=Math.max(1,Math.min(30,s.nights+ +b.dataset.d)); renderWizard(); });
    $$('#stops [data-rm]').forEach(b=>b.onclick=()=>{ wz.stops.splice(+b.dataset.rm,1); renderWizard(); });
  }
  if(st==='fechas') $('#start').onchange=e=>{ if(e.target.value){ wz.start=e.target.value; renderWizard(); } };
  if(st==='viajeros'){
    $$('[data-g]').forEach(b=>b.onclick=()=>{ const g=b.dataset.g; wz.group=g;
      const keep = wz.travelers.filter(t=>t.name);
      if(g==='solo') wz.travelers=[keep[0]||{name:'',age:'adulto'}];
      if(g==='pareja') wz.travelers=[keep[0]||{name:'',age:'adulto'}, keep[1]||{name:'',age:'adulto'}];
      if(g==='familia' && wz.travelers.length<3) wz.travelers=[keep[0]||{name:'',age:'adulto'}, keep[1]||{name:'',age:'adulto'}, {name:'',age:'nino'}];
      if(g==='amigos' && wz.travelers.length<3) wz.travelers=[{name:'',age:'adulto'},{name:'',age:'adulto'},{name:'',age:'adulto'}];
      renderWizard(); });
    $$('[data-tn]').forEach(i=>i.oninput=()=>{ wz.travelers[+i.dataset.tn].name=i.value; });
    $$('[data-ta]').forEach(s=>s.onchange=()=>{ wz.travelers[+s.dataset.ta].age=s.value; });
    $$('[data-trm]').forEach(b=>b.onclick=()=>{ wz.travelers.splice(+b.dataset.trm,1); renderWizard(); });
    $('#addTrav').onclick=()=>{ wz.travelers.push({name:'',age:'adulto'}); renderWizard(); };
  }

const WIZ_TIPS = [
  'Pegá el mail o subí el PDF de la confirmación en Reservas y la reserva se carga sola.',
  'Exportá las alertas al calendario (.ics): el celular te avisa aunque la app esté cerrada.',
  'Bajá el mapa de cada ciudad en tu app de mapas para usarlo sin datos.',
  'Sacale una foto al pasaporte y guardala en un lugar seguro fuera del celular.',

  'Con chicos, una actividad fuerte a la mañana y otra tranqui a la tarde suele funcionar mejor.',
  'Si llueve, el mago prioriza planes bajo techo: tocá «cambiar» en cualquier actividad.',
  'Cada viajero tiene su propia valija: tildá lo que ya guardaste y mirá el progreso.',
];
function genScreen(trip){
  const names = trip.stops.map(s=>s.name);
  const where = names.length>1 ? names.slice(0,-1).join(', ')+' y '+names[names.length-1] : names[0];
  app.innerHTML = `<div class="wrap gen" id="genScr">
    <div class="gcomp">${logoSVG('light')}</div>
    <div class="eyebrow">El mago está armando tu viaje</div>
    <h2>${esc(where)}</h2>
    <div class="gbar" role="progressbar" aria-label="Progreso"><i id="gbar"></i></div>
    <ul class="genlog" id="glog" aria-live="polite"></ul>
    <div class="gfact" id="gfact"><div class="gk" id="gk">Consejo del mago</div><p id="gtx"></p><small id="gsrc"></small></div></div>`;
  const ul=$('#glog'); let last=null, n=0, fi=0, stopped=false;
  const facts = WIZ_TIPS.map(t=>({k:'Consejo del mago', t, src:'', img:''})).sort(()=>Math.random()-.5);
  const show = () => {
    const box=$('#gfact'); if(!box) return; const f=facts[fi%facts.length]; fi++;
    box.classList.add('fade');
    setTimeout(()=>{ if(!$('#gfact')) return; $('#gk').textContent=f.k; $('#gtx').textContent=f.t; $('#gsrc').textContent=f.src; box.style.backgroundImage=f.img?`url('${f.img.replace(/'/g,'%27')}')`:''; box.classList.remove('fade'); }, fi===1?0:350);
  };
  show(); const timer=setInterval(show, 4200);
  // datos curiosos del destino (Wikipedia) cuando hay red
  if(LIVE!==false) detectLive().then(live=>{ if(!live) return;
    trip.stops.forEach(st=> wikiSummary(st.name,'es').then(sm=>{ if(stopped||!sm||!sm.text) return;
      const sents=(sm.text.match(/[^.!?]+[.!?]+/g)||[]).map(x=>x.trim()).filter(x=>x.length>40&&x.length<260).slice(0,3);
      const nw=sents.map(t=>({k:'¿Sabías que…? · '+st.name, t, src:'Fuente: Wikipedia', img:sm.img||''}));
      facts.splice(fi, 0, ...nw); }).catch(()=>{}) ); });
  const total = () => LIVE ? names.length*2+2 : SAMPLE ? names.length+2 : 2;
  const bar = () => { const b=$('#gbar'); if(b) b.style.width=Math.min(96,Math.max(4,n/total()*100))+'%'; };
  bar();
  return {
    log(msg){ if(last){ last.className='ok'; n++; } last=document.createElement('li'); last.className='run'; last.textContent=msg; ul.appendChild(last); bar(); },
    done(){ if(last) last.className='ok'; const b=$('#gbar'); if(b) b.style.width='100%'; },
    stop(){ stopped=true; clearInterval(timer); }
  };
}

function nightsOf(t){ return t.stops.reduce((a,s)=>a+s.nights,0); }
function tripStatus(t){
  const today=D.today(), end=t.end||D.add(t.start,nightsOf(t));
  const d=D.diff(today,t.start);
  if(d>0) return {k:'next', d, label: d===1?'¡Sale mañana!':`Faltan ${d} días`};
  if(D.diff(today,end)>=0) return {k:'now', d:0, label:`En viaje · día ${D.diff(t.start,today)+1}`};
  return {k:'past', d, label:'Terminado'};
}
function tripCardHTML(t){
  const st=tripStatus(t); const img=t.stops[0]&&t.stops[0].img;
  return `<div class="card tripcard" data-id="${t.id}">
    <div class="ph" style="${img?`background-image:url('${esc(img)}')`:''}">${img?'':'🧭'}</div>
    <div class="grow"><h3>${esc(t.name)}</h3><div class="small muted">${D.nice(t.start,{day:'numeric',month:'short',year:'numeric'})} · ${nightsOf(t)} noches · ${t.travelers.length} ${t.travelers.length===1?'viajero':'viajeros'}</div>
    <span class="when-pill ${st.k==='now'?'now':st.k==='past'?'past':''}">${st.label}</span></div>
    <span class="muted">›</span></div>`;
}
function tripGroups(){
  const withSt=trips.map(t=>({t,st:tripStatus(t)}));
  const act=withSt.filter(x=>x.st.k!=='past').sort((a,b)=>a.t.start>b.t.start?1:-1);
  const past=withSt.filter(x=>x.st.k==='past').sort((a,b)=>a.t.start<b.t.start?1:-1);
  return (act.length?`${past.length?'<div class="tripgroup">Próximos</div>':''}${act.map(x=>tripCardHTML(x.t)).join('')}`:'')
       + (past.length?`<div class="tripgroup">Viajes pasados</div>${past.map(x=>tripCardHTML(x.t)).join('')}`:'');
}

/* Resumen del viaje (mejora 4) */
function summaryCard(t){
  const st=tripStatus(t);
  const nextA=buildAlerts(t).find(a=>+a.when>Date.now());
  const pk=Object.values(t.packing||{}).flat(); const pkOn=pk.filter(x=>x.on).length; const pkPct=pk.length?Math.round(pkOn/pk.length*100):0;
  const b=budgetCalc(t); const nb=(t.bookings||[]).length;
  const lodgNights=new Set(); (t.bookings||[]).filter(x=>LODGING.includes(x.type)&&x.date).forEach(x=>{ const e=x.endDate||D.add(x.date,1); for(let d=x.date; d<e && D.diff(d,e)>0 && lodgNights.size<400; d=D.add(d,1)) lodgNights.add(d); });
  const nights=nightsOf(t); const covered=Math.min(nights,[...lodgNights].filter(d=>d>=t.start&&d<D.add(t.start,nights)).length);
  const cdBig = st.k==='next' ? `<b>${st.d}</b><span>${st.d===1?'día':'días'}</span>` : st.k==='now' ? `<b>${D.diff(t.start,D.today())+1}</b><span>de ${nights+1}</span>` : `<b>✓</b><span>viajado</span>`;
  return `<div class="card sum">
    <div class="cd">${cdBig}</div>
    <div class="nx"><span class="muted small">${st.k==='next'?'Para salir':st.k==='now'?'Día del viaje':'Viaje terminado'}</span>

/* Editar viaje (mejora 5) */
function editTripModal(){
  const t=cur; const e={name:t.name, start:t.start, stops:t.stops.map(s=>({...s})), travelers:t.travelers.map(x=>({...x})), interests:[...t.interests], pace:t.pace, budget:{...t.budget}};
  const draw=()=>{ openModal(`<h3>Editar viaje</h3>
    <div class="field"><label>Nombre</label><input class="inp" id="e_name" value="${esc(e.name)}"></div>
    <div class="field"><label>Fecha de salida</label><input type="date" class="inp" id="e_start" value="${e.start}"></div>
    <div class="ed-sec">Noches por ciudad</div>
    ${e.stops.map((s,i)=>`<div class="card stop"><div class="num">${i+1}</div><div class="grow"><b>${esc(s.name)}</b></div><div class="stepper"><button data-en="${i}" data-d="-1">−</button><b>${s.nights}</b><button data-en="${i}" data-d="1">+</button></div></div>`).join('')}
    <div class="ed-sec">Viajeros</div>
    ${e.travelers.map((x,i)=>`<div class="card trav"><input class="inp" data-etn="${i}" value="${esc(x.name)}" placeholder="Nombre"><select data-eta="${i}">${AGES.map(([k,l])=>`<option value="${k}" ${x.age===k?'selected':''}>${l}</option>`).join('')}</select>${e.travelers.length>1?`<button class="x" data-etr="${i}" aria-label="Quitar">×</button>`:''}</div>`).join('')}
    <button class="btn ghost sm" id="e_addT">＋ Agregar viajero</button>
    <div class="ed-sec">Intereses</div>
    <div class="chips">${INTERESTS.map(([k,em,l])=>`<button class="chip ${e.interests.includes(k)?'on':''}" data-ei="${k}">${em} ${l}</button>`).join('')}</div>
    <div class="ed-sec">Ritmo y presupuesto</div>
    <div class="chips">${Object.entries(PACE).map(([k,p])=>`<button class="chip ${e.pace===k?'on':''}" data-ep="${k}">${p.l}</button>`).join('')}</div><div style="height:8px"></div>
    <div class="chips">${Object.entries(LEVELS).map(([k,l])=>`<button class="chip ${e.budget.level===k?'on':''}" data-el="${k}">${l.e} ${l.l}</button>`).join('')}</div>
    <div class="g2" style="margin-top:10px"><div class="field"><label>Monto total</label><input class="inp" id="e_amt" inputmode="decimal" value="${esc(e.budget.amount||'')}"></div><div class="field"><label>Moneda</label><select class="inp" id="e_cur">${['USD','EUR','ARS','BRL','CLP','UYU','MXN'].map(c=>`<option ${e.budget.cur===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <div class="note">Si cambiás fechas, noches, intereses, ritmo o presupuesto se rearma el itinerario. Las reservas y los tildes de la valija se conservan.</div>
    <div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn dark grow" id="e_save">Guardar cambios</button></div>`);
    const read=()=>{ e.name=$('#e_name').value.trim()||e.name; e.start=$('#e_start').value||e.start; e.budget.amount=$('#e_amt').value.replace(/[^\d.,]/g,''); e.budget.cur=$('#e_cur').value; };
    $$('[data-en]').forEach(b=>b.onclick=()=>{ read(); const s=e.stops[+b.dataset.en]; s.nights=Math.max(1,Math.min(30,s.nights+ +b.dataset.d)); draw(); });
    $$('[data-etn]').forEach(i=>i.oninput=()=>{ e.travelers[+i.dataset.etn].name=i.value; });
    $$('[data-eta]').forEach(x=>x.onchange=()=>{ e.travelers[+x.dataset.eta].age=x.value; });
    $$('[data-etr]').forEach(b=>b.onclick=()=>{ read(); e.travelers.splice(+b.dataset.etr,1); draw(); });
    $('#e_addT').onclick=()=>{ read(); e.travelers.push({name:'Viajero '+(e.travelers.length+1),age:'adulto'}); draw(); };
    $$('[data-ei]').forEach(b=>b.onclick=()=>{ const k=b.dataset.ei; e.interests=e.interests.includes(k)?e.interests.filter(x=>x!==k):[...e.interests,k]; b.classList.toggle('on'); });
    $$('[data-ep]').forEach(b=>b.onclick=()=>{ e.pace=b.dataset.ep; $$('[data-ep]').forEach(x=>x.classList.toggle('on',x===b)); });
    $$('[data-el]').forEach(b=>b.onclick=()=>{ e.budget.level=b.dataset.el; $$('[data-el]').forEach(x=>x.classList.toggle('on',x===b)); });
    $('#e_save').onclick=async()=>{ read(); await applyTripEdit(e); };
  };
  draw();
}
async function applyTripEdit(e){
  const t=cur;
  const datesCh = e.start!==t.start || e.stops.some((s,i)=>s.nights!==t.stops[i].nights);
  const travCh = JSON.stringify(e.travelers)!==JSON.stringify(t.travelers);
  const planCh = datesCh || e.pace!==t.pace || e.budget.level!==t.budget.level || e.interests.join()!==t.interests.join();
  t.name=e.name; t.start=e.start; t.stops.forEach((s,i)=>s.nights=e.stops[i].nights); t.travelers=e.travelers.map((x,i)=>({name:x.name.trim()||'Viajero '+(i+1),age:x.age}));
  t.interests=e.interests; t.pace=e.pace; t.budget=e.budget; t.end=D.add(t.start,nightsOf(t));
  closeModal();
  if(datesCh && LIVE && t.source==='web'){
    toast('Actualizando el clima…');
    t.weather={}; let date=t.start;
    for(const [si,stop] of t.stops.entries()){ const sEnd=D.add(date,stop.nights); if(stop.lat!=null){ const w=await weatherFor(stop,date,sEnd); if(w){ t.weatherKind=w.kind; w.days.forEach(d=>{ if(!t.weather[d.date]||d.date!==sEnd) t.weather[d.date]={...d,stop:si}; }); } } date=sEnd; }
  } else if(datesCh && t.weatherKind==='tipico'){
    const old=Object.values(t.weather||{}); const byStop={}; old.forEach(w=>{ byStop[w.stop]=w; }); t.weather={}; let date=t.start;
    t.stops.forEach((s,si)=>{ const w=byStop[si]; if(w) for(let i=0;i<=s.nights;i++){ const d=D.add(date,i); t.weather[d]={...w,date:d}; } date=D.add(date,s.nights); });
  } else if(datesCh){ t.weather={}; }
  if(planCh) t.days=schedule(t);
  if(travCh || datesCh){ const old=t.packing||{}; const nu=buildPacking(t); Object.entries(nu).forEach(([who,list])=>{ const prev=old[who]||[]; list.forEach(x=>{ const m=prev.find(y=>y.item===x.item); if(m) x.on=m.on; }); const extra=prev.filter(y=>!list.some(x=>x.item===y.item) && !y.auto && y.custom); list.push(...extra); }); t.packing=nu; }
  saveCur(); renderTrip(); scheduleNotifs(t);
  toast(planCh?'Viaje actualizado e itinerario rearmado':'Viaje actualizado');
}

/* Duplicar viaje (mejora 6) */
function duplicateTrip(){
  const c=JSON.parse(JSON.stringify(cur)); c.id=uid(); c.createdAt=Date.now(); c.name=cur.name+' (copia)'; c.bookings=[];
  (c.days||[]).forEach(d=>d.items.forEach(x=>x.done=false)); Object.values(c.packing||{}).forEach(l=>l.forEach(x=>x.on=false));
  trips.unshift(c); saveTrips(); cur=c; tab='plan'; renderTrip();
  toast('Copia creada (sin reservas). Cambiale la fecha.'); setTimeout(editTripModal,400);
}

/* Sponsors (mejora 21) */
function activeSponsors(where){
  const today=D.today(); const t=cur;
  return SPONSORS.filter(s=>(!s.where||s.where.includes(where)) && (!s.from||s.from<=today) && (!s.to||s.to>=today)
    && (!s.dest||!t||t.stops.some(st=>s.dest.some(d=>norm(st.name+' '+(st.country||'')).includes(norm(d)))))
    && (!s.ints||!t||s.ints.some(i=>t.interests.includes(i)))
    && (s.kids==null||!t||s.kids===hasKids(t)));
}
function sponsorSlot(where){
  const list=activeSponsors(where);
  if(list.length){ const s=list[Math.floor(Math.random()*list.length)];
    return `<a class="spon" href="${esc(s.url)}" target="_blank" rel="noopener sponsored" data-spon="${esc(s.id)}"><span class="sl">Patrocinado</span><div class="se" style="${s.img?`background-image:url('${esc(s.img)}')`:''}">${s.img?'':esc(s.emoji||'✨')}</div><div><b>${esc(s.title)}</b><p>${esc(s.text)}</p><span class="cta">${esc(s.cta||'Ver más')} ↗</span></div></a>`; }
  const copy={home:'Llegá a familias y viajeros justo cuando planifican.',reservas:'Seguros, eSIM, traslados: aparecé cuando reservan.',valijas:'Tu producto en la lista de la valija, en el momento justo.',alertas:'Tu marca en la previa del viaje.'}[where]||'';
  return `<button class="spon" data-house="1" style="width:100%;text-align:left;cursor:pointer;font:inherit"><span class="sl">Espacio disponible</span><div class="se">✨</div><div><b>Tu marca acá</b><p>${copy}</p><span class="cta">Ver formatos para marcas →</span></div></button>`;
}
function wireSponsors(root=document){ $$('[data-house]',root).forEach(b=>b.onclick=renderBrands); }
function addSponsor(where){ const B=$('#tabBody'); if(!B||$('.spon',B)) return; B.insertAdjacentHTML('beforeend',sponsorSlot(where)); wireSponsors(B); }
