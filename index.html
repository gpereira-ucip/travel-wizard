<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Travel Wizard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
<meta name="description" content="Armá tu viaje en minutos: itinerario día por día, reservas, alertas, valijas y presupuesto en una sola app.">
<meta property="og:type" content="website">
<meta property="og:title" content="Travel Wizard · Tu viaje armado en minutos">
<meta property="og:description" content="Armá tu viaje en minutos: itinerario día por día, reservas, alertas, valijas y presupuesto en una sola app.">
<link rel="icon" id="favIcon" type="image/svg+xml" href="data:,">
<link rel="apple-touch-icon" id="touchIcon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#14213d; --night2:#1f3160; --gold:#e0a84f; --gold2:#f4d38f; --coral:#e76f51; --teal:#2a9d8f;
  --bg:#faf7f2; --bg2:#f2ece1; --card:#ffffff; --ink:#1f2933; --muted:#536170; --line:#e6dfd3;
  /* v0.14 (mejora 15): colores para TEXTO con contraste AA (≥4,5:1) sobre fondo, fondo 2 y tarjeta; --teal/--gold/--coral quedan para rellenos */
  --teal-ink:#1b7268; --gold-ink:#8a5d0f; --coral-ink:#b0422a;
  --ok:#2a9d8f; --warn:#d98a1f; --bad:#c8553d;
  --r1:10px; --r2:18px; --r3:26px;
  --sh1:0 4px 14px rgba(20,33,61,.06); --sh2:0 12px 32px rgba(20,33,61,.12);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --bg:#0e1525; --bg2:#152038; --card:#18233b; --ink:#eef1f6; --muted:#9aa7bb; --line:#26344f;
  --teal-ink:#3cbcad; --gold-ink:#e0a84f; --coral-ink:#f08a70;
  --sh1:0 4px 14px rgba(0,0,0,.3); --sh2:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-contrast:more){
  :root{--muted:#3a4654;--line:#b9b1a3;--teal-ink:#145a52;--gold-ink:#6e4a0a;--coral-ink:#8f3420}
  [data-theme=dark]{--muted:#c3ccda;--line:#4a5a7a;--teal-ink:#5fd3c5;--gold-ink:#f4d38f;--coral-ink:#f6a690}
  .thero::before,.nextfeat::before{background:linear-gradient(180deg,rgba(10,16,35,.6),rgba(10,16,35,.92))}
}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal-ink)}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

/* top bar */
.top{position:sticky;top:0;z-index:40;padding-top:var(--safe-t);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.2px;font-size:17px;background:none;border:0;padding:0}
.brand svg{width:32px;height:32px;filter:drop-shadow(0 2px 6px rgba(20,33,61,.25))}
[data-theme=dark] .brand .lg-disc{fill:#1f3160}
[data-theme=dark] .brand .lg-ring{opacity:1}
.twlogo .lg-needle{transform-box:view-box;transform-origin:50% 50%}
.brand:hover .lg-needle{animation:wobble 1.2s ease-in-out}
@keyframes wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg)}60%{transform:rotate(8deg)}}
/* portada animada (mejora 8) */
.stars .tw{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
.shoot{position:absolute;top:18%;left:-20%;width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;transform:rotate(-18deg);animation:shoot 9s ease-in 2.5s infinite;pointer-events:none}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-18deg)}2%{opacity:1}9%{opacity:0;transform:translate(520px,-170px) rotate(-18deg)}100%{opacity:0;transform:translate(520px,-170px) rotate(-18deg)}}
.hero-logo{position:absolute;top:22px;right:16px;width:92px;height:92px;opacity:.95;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));animation:logoIn 1.4s cubic-bezier(.2,.8,.2,1) both}
.hero-logo .lg-needle{animation:needleIn 2.2s cubic-bezier(.3,1.5,.4,1) .2s both}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-40deg)}to{opacity:.95;transform:none}}
@keyframes needleIn{from{transform:rotate(-540deg)}to{transform:rotate(0)}}
.hero .wrap>.eyebrow,.hero h1,.hero .wrap>p{position:relative}
.hero h1,.hero .wrap>p,.hero .wrap>.eyebrow{padding-right:0}
@media (max-width:640px){.hero-logo{width:54px;height:54px;top:-36px;right:14px}}
@media (min-width:900px){.hero-logo{width:124px;height:124px;top:6px}}
.nextfeat{position:relative;display:block;width:100%;margin:22px 0 4px;border:1px solid rgba(255,255,255,.18);border-radius:22px;overflow:hidden;min-height:150px;padding:0;text-align:left;color:#fff;background:linear-gradient(135deg,#1f3160,#2a9d8f);background-size:cover;background-position:center;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:riseIn .6s .1s both}
.nextfeat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,35,.05) 10%,rgba(10,16,35,.88))}
.nextfeat .nf{position:relative;display:flex;align-items:flex-end;gap:14px;padding:16px;min-height:150px}
.nextfeat .nf-cd{flex:none;width:72px;height:72px;border-radius:18px;background:rgba(20,33,61,.72);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;border:1px solid rgba(244,211,143,.4)}
.nextfeat .nf-cd b{font-family:var(--serif);font-size:32px;color:var(--gold2)}
.nextfeat .nf-cd span{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#c9d3e6;margin-top:3px}
.nextfeat i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2)}
.nextfeat h3{font-family:var(--serif);font-size:26px;line-height:1.05;margin:2px 0 3px;font-weight:600}
.nextfeat small{color:#dfe6f2;font-size:12px}
.nextfeat .nf-go{position:absolute;top:12px;right:12px;font-size:12px;font-weight:800;background:rgba(10,16,35,.5);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 10px}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* pantalla de carga del mago (mejora 9) */
.gcomp{width:132px;height:132px;position:relative}
.gcomp::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 35%,transparent),transparent 70%);animation:pulse 2.4s ease-in-out infinite}
.gcomp svg{position:relative;width:100%;height:100%}
.gcomp .lg-needle{animation:seek 3.2s cubic-bezier(.45,0,.2,1) infinite}
@keyframes seek{0%{transform:rotate(0)}35%{transform:rotate(200deg)}55%{transform:rotate(160deg)}75%{transform:rotate(370deg)}100%{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.gen h2{font-family:var(--serif);font-size:30px;line-height:1.1;margin:0;font-weight:600}
.gbar{width:100%;max-width:340px;height:8px;border-radius:8px;background:var(--bg2);overflow:hidden}
.gbar i{display:block;height:100%;width:4%;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .6s ease}
.gfact{width:100%;max-width:420px;min-height:132px;border-radius:var(--r2);padding:16px 18px;text-align:left;position:relative;overflow:hidden;color:#fff;background:linear-gradient(140deg,var(--night),var(--night2));background-size:cover;background-position:center;box-shadow:var(--sh2)}
.gfact::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,35,.35),rgba(10,16,35,.9))}
.gfact>*{position:relative}
.gfact .gk{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2)}
.gfact p{margin:6px 0 4px;font-size:15px;line-height:1.45;transition:opacity .35s}
.gfact small{font-size:11px;color:#c9d3e6}
.gfact.fade p,.gfact.fade small{opacity:0}
@media (prefers-reduced-motion:reduce){.stars .tw,.shoot,.hero-logo,.hero-logo .lg-needle,.nextfeat,.gcomp::before,.gcomp .lg-needle,.brand:hover .lg-needle{animation:none!important}.shoot{display:none}}
.brand span b{color:var(--gold-ink)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px}
/* theme switch */
.switch{position:relative;width:54px;height:30px;border-radius:30px;border:1px solid var(--line);background:var(--bg2);padding:0}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--gold);transition:transform .3s;display:grid;place-items:center;font-style:normal;font-size:12px}
[data-theme=dark] .switch i{transform:translateX(24px);background:var(--night2)}

/* home */
.hero{position:relative;border-radius:0 0 var(--r3) var(--r3);overflow:hidden;background:radial-gradient(1200px 400px at 80% -10%,#3b5998 0%,transparent 60%),linear-gradient(160deg,var(--night) 0%,#0b1430 100%);color:#fff;padding:46px 0 40px}
.hero .stars{position:absolute;inset:0;opacity:.6;pointer-events:none}
.hero h1{font-family:var(--serif);font-size:44px;line-height:1.05;margin:6px 0 10px;font-weight:600}
.hero h1 em{color:var(--gold2)}
.hero p{color:#c9d3e6;max-width:520px;margin:0 0 22px}
.eyebrow{text-transform:uppercase;letter-spacing:2.4px;font-size:11px;font-weight:700;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--gold);color:#1b1b1b;box-shadow:var(--sh1);transition:transform .12s,filter .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.dark{background:var(--night);color:#fff}
[data-theme=dark] .btn.dark{background:var(--night2)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.feat div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;font-size:12px;color:#dfe6f3}
.feat b{display:block;font-size:18px}
h2.sec{font-family:var(--serif);font-size:28px;font-weight:600;margin:28px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh1)}
.tripcard{display:flex;gap:14px;padding:14px;margin-bottom:12px;align-items:center;cursor:pointer}
.tripcard .ph{width:64px;height:64px;border-radius:14px;flex:none;background:linear-gradient(135deg,var(--night2),var(--teal));display:grid;place-items:center;font-size:28px;background-size:cover;background-position:center}
.tripcard h3{margin:0;font-size:16px}
.tripcard[style*="--tacc"]{box-shadow:inset 4px 0 0 var(--tacc),var(--sh1)}
.accs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc-sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:12px;font-weight:700;color:var(--ink)}
.acc-sw i{width:100%;height:34px;border-radius:9px;position:relative;overflow:hidden}
.acc-sw i::after{content:"";position:absolute;right:7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--sc);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.acc-sw.on{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
.acc-sw.on span::before{content:"✓ "}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* estados vacíos ilustrados (mejora 13) */
.es{text-align:center;padding:22px 18px 20px;color:var(--muted);position:relative;overflow:hidden}
.es::before{content:"";position:absolute;inset:-40% -20% auto;height:150px;background:radial-gradient(closest-side,color-mix(in srgb,var(--gold) 16%,transparent),transparent);pointer-events:none}
.es-art{width:132px;height:104px;margin:0 auto 8px;position:relative}
.es-art svg{width:100%;height:100%;display:block;overflow:visible}
.es-t{display:block;font-family:var(--serif);font-size:25px;line-height:1.1;font-weight:600;color:var(--ink);margin-bottom:6px;position:relative}
.es p{margin:0 auto;max-width:34ch;font-size:14px;line-height:1.5;position:relative}
.es-act{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;position:relative}
.es-steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0 0;padding:0;list-style:none;font-size:12px;position:relative}
.es-steps li{background:var(--bg2);border-radius:20px;padding:5px 10px;color:var(--ink)}
.ideas.pulse>*{animation:esPulse 1.1s ease 1}
@keyframes esPulse{40%{transform:translateY(-4px);box-shadow:0 0 0 3px var(--gold)}}
@media (prefers-reduced-motion:reduce){.ideas.pulse>*{animation:none}}
.es-steps li b{color:var(--coral-ink);margin-right:4px}
.es.row{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;margin:14px 0 6px}
.es.row::before{inset:-60% auto auto -20%;width:220px}
.es.row .es-art{width:84px;height:68px;margin:0;flex:none}
.es.row .es-t{font-size:20px;margin-bottom:3px}
.es.row p{margin:0;font-size:13px}
.es.row .es-act{justify-content:flex-start;margin-top:10px}
.es .ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.es .gd{fill:var(--gold)} .es .gd2{fill:var(--gold2)} .es .cr{fill:var(--coral)} .es .tl{fill:var(--teal)} .es .bg2{fill:var(--bg2)} .es .cd{fill:var(--card)}
.es .dash{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
.es .tw{transform-box:fill-box;transform-origin:center;animation:esTw 2.6s ease-in-out infinite}
.es .fl{animation:esFl 4s ease-in-out infinite}
@keyframes esTw{50%{opacity:.25;transform:scale(.7)}}
@keyframes esFl{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.es .tw,.es .fl{animation:none}}

/* wizard */
.wz{min-height:calc(100vh - 58px);display:flex;flex-direction:column}
.prog{height:5px;background:var(--bg2);border-radius:5px;overflow:hidden;margin:16px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .35s}
.stepn{font-size:12px;color:var(--muted);font-weight:600}
.wz h2{font-family:var(--serif);font-size:32px;line-height:1.1;margin:10px 0 4px;font-weight:600}
.wz .lead{color:var(--muted);margin:0 0 18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);outline:none;font-size:16px}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.sugg{position:relative}
.sugg ul{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh2);z-index:30;max-height:260px;overflow:auto}
.sugg li{padding:10px 10px;border-radius:9px;cursor:pointer}
.sugg li:hover,.sugg li.on{background:var(--bg2)}
.stop{display:flex;align-items:center;gap:10px;padding:12px 12px;margin-bottom:8px}
.stop .num{width:28px;height:28px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-weight:800}
.stepper b{min-width:22px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;transition:transform .1s;user-select:none}
.chip.on{background:var(--night);border-color:var(--night);color:#fff}
[data-theme=dark] .chip.on{background:var(--gold);border-color:var(--gold);color:#1b1b1b}
.chip.lg{padding:12px 16px;font-size:15px}
.trav{display:flex;gap:8px;align-items:center;padding:10px;margin-bottom:8px;flex-wrap:wrap}
.trav input{flex:1;min-width:120px}
.trav select{padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--bg2)}
.x{border:0;background:none;color:var(--muted);font-size:20px;width:34px;height:34px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.level{padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.level.on{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.level b{display:block;font-size:16px}
.level span{font-size:12px;color:var(--muted)}
.wznav{position:sticky;bottom:0;padding:14px 0 calc(14px + var(--safe-b));margin-top:auto;display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 30%)}
.note{font-size:13px;color:var(--muted);background:var(--bg2);border-radius:12px;padding:10px 12px;margin:10px 0}

/* generating */
.gen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.orb{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--gold),var(--coral),var(--teal),var(--night2),var(--gold));animation:spin 2.2s linear infinite;display:grid;place-items:center}
.orb::after{content:"";width:86px;height:86px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.genlog{list-style:none;padding:0;margin:0;font-size:14px;color:var(--muted);text-align:left}
.genlog li{padding:3px 0}
.genlog li.ok::before{content:"✓ ";color:var(--ok);font-weight:800}
.genlog li.run::before{content:"… ";color:var(--gold-ink);font-weight:800}

/* trip */
.thero{position:relative;min-height:230px;color:#fff;display:flex;align-items:flex-end;background:linear-gradient(160deg,var(--night),#0b1430);background-size:cover;background-position:center;border-radius:0 0 var(--r3) var(--r3);overflow:hidden}
.thero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,35,.5),rgba(10,16,35,.42) 45%,rgba(10,16,35,.9))}
.hero .eyebrow,.thero .eyebrow{color:var(--gold2);text-shadow:0 1px 3px rgba(0,0,0,.55)}.thero h1{text-shadow:0 2px 12px rgba(0,0,0,.35)}
.thero .wrap{position:relative;width:100%;padding-bottom:20px;padding-top:30px}
.thero h1{font-family:var(--serif);font-size:38px;line-height:1.05;margin:4px 0 8px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:rgba(10,16,35,.38);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}

<script>
'use strict';
/* =========================================================
   Travel Wizard — v0.3 (versión de prueba)
   Un solo archivo. Funciona con conexión (fotos, clima y lugares en vivo),
   dentro de Claude (itinerario armado por Claude) o en modo básico.
   ========================================================= */
const VERSION = '0.18';
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const uid = () => Math.random().toString(36).slice(2,10);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- almacenamiento ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('tw.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('tw.'+k, JSON.stringify(v)); }catch(e){} }
};
const idb = {
  db:null,
  async open(){ if(this.db) return this.db; return this.db = await new Promise((res,rej)=>{ try{ const r = indexedDB.open('travelwizard',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); },
  async put(id, blob){ const db=await this.open(); return new Promise((res,rej)=>{const t=db.transaction('files','readwrite'); t.objectStore('files').put(blob,id); t.oncomplete=res; t.onerror=()=>rej(t.error);}); },
  async get(id){ const db=await this.open(); return new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); },
  async del(id){ try{ const db=await this.open(); db.transaction('files','readwrite').objectStore('files').delete(id);}catch(e){} }
};

/* ---------- fechas ---------- */
const D = {
  parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); },
  fmt(dt){ return dt.toISOString().slice(0,10); },
  add(s,n){ const d=D.parse(s); d.setUTCDate(d.getUTCDate()+n); return D.fmt(d); },
  diff(a,b){ return Math.round((D.parse(b)-D.parse(a))/864e5); },
  today(){ const t=new Date(); return D.fmt(new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))); },
  nice(s, opt={weekday:'short',day:'numeric',month:'short'}){ return D.parse(s).toLocaleDateString('es-AR',{...opt,timeZone:'UTC'}); },
};

/* ---------- catálogos ---------- */
const INTERESTS = [
  ['naturaleza','🌿','Naturaleza'],['shopping','🛍️','Shopping'],['cultura','🎨','Museos y arte'],['historia','🏛️','Historia'],
  ['gastronomia','🍽️','Gastronomía'],['aventura','🧗','Aventura'],['playa','🏖️','Playa'],['nocturna','🌙','Vida nocturna'],
  ['relax','🧘','Relax'],['ninos','🧸','Para chicos'],['foto','📸','Miradores y fotos']
];
const CAT = Object.fromEntries(INTERESTS.map(([id,e,l])=>[id,{e,l}]));
CAT.imperdible = {e:'⭐', l:'Imperdible'};
const AGES = [['adulto','Adulto'],['nino','Niño (3–12)'],['bebe','Bebé (0–2)'],['adolescente','Adolescente'],['mayor','Mayor (65+)']];
const LEVELS = {
  mochilero:{l:'Mochilero',d:'Hostels, transporte público, lo gratis',usd:60,max:1,e:'🎒'},
  moderado:{l:'Moderado',d:'Hotel 3★ o depto, algunas entradas',usd:150,max:2,e:'🧳'},
  confort:{l:'Confort',d:'Hotel 4★, excursiones, buenos restaurantes',usd:280,max:3,e:'🛎️'},
  lujo:{l:'Lujo',d:'5★, experiencias privadas',usd:550,max:3,e:'💎'}
};
const PACE = {tranquilo:{l:'Tranquilo',n:2},moderado:{l:'Moderado',n:3},intenso:{l:'Intenso',n:4}};
const COST = ['Gratis','$','$$','$$$'];

/* Inspiración: un toque precarga el asistente (mejora 3) */
const IDEAS = [
  {e:'💦', t:'Cataratas del Iguazú', sub:'Selva y saltos · 4 noches', tag:'Naturaleza', bg:'linear-gradient(160deg,#1b4d3e,#38a3a5)', stops:[['Puerto Iguazú',4]], ints:['naturaleza','aventura','foto']},
  {e:'🏔️', t:'Bariloche', sub:'Lagos y montaña · 5 noches', tag:'Nieve y lagos', bg:'linear-gradient(160deg,#14213d,#4f7cac)', stops:[['San Carlos de Bariloche',5]], ints:['naturaleza','aventura','gastronomia']},
  {e:'🏰', t:'Praga · Viena · Innsbruck', sub:'Europa central · 9 noches', tag:'Ciudades', bg:'linear-gradient(160deg,#5b2a3c,#c85a32)', stops:[['Praga',4],['Viena',3],['Innsbruck',2]], ints:['historia','cultura','gastronomia']},
  {e:'🏖️', t:'Río de Janeiro', sub:'Playa y morros · 6 noches', tag:'Playa', bg:'linear-gradient(160deg,#0f6e8c,#e9b44c)', stops:[['Río de Janeiro',6]], ints:['playa','foto','nocturna']},
  {e:'🎢', t:'Orlando', sub:'Parques con chicos · 7 noches', tag:'Con chicos', bg:'linear-gradient(160deg,#3a0ca3,#f72585)', stops:[['Orlando',7]], ints:['ninos','shopping','aventura']},
  {e:'🍷', t:'Mendoza', sub:'Bodegas y Andes · 4 noches', tag:'Gastronomía', bg:'linear-gradient(160deg,#5e1f3d,#b5838d)', stops:[['Mendoza',4]], ints:['gastronomia','naturaleza','relax']},
  {e:'🌵', t:'Salta y Jujuy', sub:'Quebradas y colores · 6 noches', tag:'Norte', bg:'linear-gradient(160deg,#9c4221,#e0a84f)', stops:[['Salta',3],['Purmamarca',3]], ints:['naturaleza','historia','foto']},
  {e:'🥘', t:'Madrid · Barcelona', sub:'Arte, tapas y mar · 8 noches', tag:'Ciudades', bg:'linear-gradient(160deg,#9d0208,#f48c06)', stops:[['Madrid',4],['Barcelona',4]], ints:['cultura','gastronomia','shopping']},
];

/* Sponsors (mejoras 21–22). Se cargan acá: {id, brand, title, text, url, cta, emoji, img, where:[home,reservas,valijas,alertas], dest:[...], ints:[...], kids:true/false, from:'YYYY-MM-DD', to:'YYYY-MM-DD'}.
   Mientras no haya sponsors activos se muestra un aviso propio «Tu marca acá». */
const SPONSORS = [];
const CONTACT_EMAIL = ''; // contacto comercial: lo define Gonzalo

/* Novedades por versión (mejora 1) */
const NEWS = [
  ['0.18','23 nov 2026',['La primera vez que abrís la app, tres tarjetas te cuentan cómo funciona: armá el viaje en un minuto, cargá las reservas desde el mail o el PDF, y tené la valija de cada uno y el presupuesto a mano.','Se pasan deslizando o con «Siguiente», y podés saltarlas cuando quieras. Para verlas de nuevo, tocá «¿Cómo funciona?» al pie del inicio.']],
  ['0.17','22 nov 2026',['Modo presentación: tocá ▶ Presentar arriba del viaje y mostrale el plan a la familia en pantalla completa, un día por pantalla, con fotos grandes, el clima y lo que van a hacer.','Pasá de día deslizando, tocando los costados o con las flechas del teclado; ▶ lo pasa solo cada 7 segundos. Las rayitas de arriba muestran dónde estás y tocándolas saltás a cualquier día.']],
  ['0.16','21 nov 2026',['El numerito de la pestaña 🔔 Alertas (cuántos avisos tenés en los próximos días) y la etiqueta «en viaje» de Mis viajes ahora se leen bien a pleno sol: coral más firme, contraste AA en modo claro y oscuro, también con el color de cada viaje.']],
  ['0.15','20 nov 2026',['Cada viaje puede tener su propio color, como las bitácoras: en ✏️ Editar → «Color del viaje» elegí Noche y dorado, Mar, Selva, Terracota, Lavanda o Nieve. Se ve al instante, antes de guardar.','El color tiñe la portada, los encabezados de cada día, los botones, las barras y la rayita de la pestaña, y se mantiene legible en modo claro y oscuro.','En el inicio, la tarjeta de cada viaje y la del próximo viaje muestran su color.']],
  ['0.14','20 nov 2026',['Todo se lee mejor a pleno sol: los textos grises son más oscuros y los verdes, dorados y corales que se usan como letra tienen ahora una versión más firme, con contraste AA (al menos 4,5 a 1) en modo claro y en modo oscuro.','Sobre las fotos (portada del viaje, próximo viaje e ideas) hay un velo más parejo, así las fechas, los datos y el botón Editar se leen aunque la foto sea clara.','Las alertas que ya pasaron se ven atenuadas sin perder legibilidad, y la etiqueta «Espacio disponible / Patrocinado» es un poco más grande.','Si en el celular activás «Aumentar contraste», la app lo respeta y refuerza grises y bordes.']],
  ['0.13','20 nov 2026',['En la computadora y en la tablet acostada, el itinerario se ve en dos columnas: los días a la izquierda y el mapa fijo a la derecha, que te acompaña mientras bajás.','El mapa sigue al día que estás leyendo: cambia solo al destino de ese día, marca sus lugares en coral y se acerca a ellos. Tocá el encabezado de un día para verlo, o elegí arriba del mapa «Recorrido» o cada ciudad.']],

async function fetchJSON(url, ms=9000){

  finally{ clearTimeout(to); }
}

    const chunk = titles.slice(i,i+20);
    try{
      const j = await fetchJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&exsentences=2&exlimit=20&titles=${encodeURIComponent(chunk.join('|'))}`);

async function weatherFor(stop, start, end){
  const today = D.today();
  const daysAhead = D.diff(today, start);
  const daily = 'weather_code,temperature_2m_max,temperature_2m_min';
  try{
    if(daysAhead >= 0 && D.diff(today,end) <= 15){
      const j = await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${stop.lat}&longitude=${stop.lon}&daily=${daily},precipitation_probability_max,precipitation_sum&timezone=auto&start_date=${start}&end_date=${end}`);
      return {kind:'pronostico', days:j.daily.time.map((t,i)=>({date:t, code:j.daily.weather_code[i], tmax:j.daily.temperature_2m_max[i], tmin:j.daily.temperature_2m_min[i], rain:j.daily.precipitation_sum[i], prob:(j.daily.precipitation_probability_max||[])[i]}))};
    }
    // referencia: mismas fechas del año anterior (o del último año con datos)
    let back = 1; while(D.diff(D.add(end,-365*back), today) < 6) back++;
    const s = D.add(start,-365*back), e = D.add(end,-365*back);
    const j = await fetchJSON(`https://archive-api.open-meteo.com/v1/archive?latitude=${stop.lat}&longitude=${stop.lon}&daily=${daily},precipitation_sum&timezone=auto&start_date=${s}&end_date=${e}`);
    return {kind:'referencia', days:j.daily.time.map((t,i)=>({date:D.add(t,365*back), code:j.daily.weather_code[i], tmax:j.daily.temperature_2m_max[i], tmin:j.daily.temperature_2m_min[i], rain:j.daily.precipitation_sum[i]}))};
  }catch(e){ return null; }
}

function km(a,b){ if(a.lat==null||b.lat==null) return 3; const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function hasKids(trip){ return trip.travelers.some(t=>t.age==='nino'||t.age==='bebe'); }
function scoreItem(it, trip){
  const w = c => trip.interests.includes(c) ? 3 : (c==='historia'||c==='imperdible'||c==='cultura' ? 1.2 : 0.6);
  let s = Math.max(...it.cats.map(w));
  if(it.len) s *= 1 + Math.log10(Math.max(it.len,1000))/4;
  if(it.img) s += .6;
  if(hasKids(trip) && it.cats.includes('ninos')) s += 2;
  if(hasKids(trip) && it.cats.includes('nocturna')) s -= 2;
  if(it.generic) s *= .55;
  return s;
}

  trip.pool = trip.pool || {};
  trip.stops.forEach((stop, si)=>{
    const pool = (trip.pool[si]||[]).filter(p=>p.cost<=maxCost).map(p=>({...p, score:scoreItem(p,trip)})).sort((a,b)=>b.score-a.score);
    const used = new Set();
    const sd = days.filter(d=>d.stop===si);
    sd.forEach(day=>{
      let n = cap; if(day.kind!=='normal') n = day.kind==='regreso' ? 1 : Math.max(1,cap-2);
      if(day.kind==='regreso' && trip.stops.length && si===trip.stops.length-1){ /* mañana libre antes de volver */ }
      const w = (trip.weather||{})[day.date]; const rainy = isRainy(w);
      const chosen=[];
      for(let k=0;k<n;k++){
        const anchor = chosen[0];
        let best=null, bs=-1e9;
        for(const p of pool){ if(used.has(p.id)) continue;
          let s = p.score; if(anchor) s -= km(anchor,p)*0.5; if(rainy && !p.indoor) s -= 2.5;
          if(chosen.some(c=>c.generic) && p.generic) s -= 3;
          if(s>bs){bs=s;best=p;} }
        if(!best) break; used.add(best.id); chosen.push(best);
      }
      // orden: mañana → tarde → noche
      const ord = {manana:0, mediodia:1, tarde:2, noche:3};
      chosen.sort((a,b)=>(ord[a.slot]??(a.cats.includes('nocturna')?3:1.5))-(ord[b.slot]??(b.cats.includes('nocturna')?3:1.5)));
      const times = day.kind==='normal' ? ({1:['10:00'],2:['10:00','16:00'],3:['09:30','13:30','17:00'],4:['09:00','12:30','16:00','20:30']}[chosen.length]||['10:00'])
                   : day.kind==='regreso' ? ['09:30'] : ({1:['17:00'],2:['16:00','20:00']}[chosen.length]||['17:00']);
      day.items = chosen.map((p,i)=>({ref:p.id, time:times[i]||'', done:false}));
    });
    trip.used = trip.used || {}; trip.used[si] = [...used];
  });
  return days;
}

/* ---------- generación completa ---------- */
async function generate(trip, log){
  trip.pool = {}; trip.weather = {}; trip.source = 'basico'; trip.intro = {};
  const end = D.add(trip.start, trip.stops.reduce((a,s)=>a+s.nights,0));
  const live = await detectLive();
  if(!SAMPLE && window.claude) await initClaude();
  if(live){
    for(const s of trip.stops){ if(s.lat==null){ try{ const g=(await geocode(s.name))[0]; if(g) Object.assign(s,{lat:g.lat,lon:g.lon,country:g.country,cc:g.cc,admin:g.admin}); }catch(e){} } }
    if(trip.origin && !trip.origin.cc && trip.origin.name){ try{ const g=(await geocode(trip.origin.name))[0]; if(g) trip.origin={...g}; }catch(e){} }
    trip.source='web';
    let date = trip.start;
    for(const [si,stop] of trip.stops.entries()){
      log(`Buscando lugares en ${stop.name}…`);
      let raw=[];
      try{ raw = await wikiNearby(stop.lat, stop.lon, 'es'); if(raw.length<25) raw = raw.concat(await wikiNearby(stop.lat, stop.lon, 'en')); }catch(e){}
      const seen=new Set(); const items=[];
      raw.forEach(p=>{ const k=norm(p.title); if(seen.has(k)) return; seen.add(k); const c=classify(p); if(!c) return; items.push({id:uid(), ...p, ...c}); });
      items.sort((a,b)=>b.len-a.len);
      const top = items.slice(0,45);
      const ex = await wikiExtracts(top.filter(i=>i.lang==='es').map(i=>i.title),'es');
      const exEn = await wikiExtracts(top.filter(i=>i.lang==='en').map(i=>i.title),'en');
      top.forEach(i=>{ i.text = ex[i.title]||exEn[i.title]||''; });
      trip.pool[si] = top.concat(genericFor(trip, stop));
      log(`Consultando el clima en ${stop.name}…`);
      const sEnd = D.add(date, stop.nights);
      const w = await weatherFor(stop, date, sEnd);
      if(w){ trip.weatherKind = w.kind; w.days.forEach(d=>{ if(!trip.weather[d.date] || d.date!==sEnd) trip.weather[d.date]={...d, stop:si}; }); }
      if(!stop.img){ const s = await wikiSummary(stop.name,'es'); if(s){ stop.img=s.img; trip.intro[si]=s.text; } }
      date = sEnd;
    }
  } else if(SAMPLE){
    trip.source='claude';
    let date = trip.start;
    for(const [si,stop] of trip.stops.entries()){
      log(`Claude está armando ${stop.name}…`);
      try{
        const v = await claudePlaces(trip, stop, stop.nights);
        trip.intro[si] = v.intro||'';
        const acts = (v.activities||[]).map(a=>({id:uid(), title:a.title, desc:a.area||'', text:a.desc||'', cats:(a.cats||[]).filter(c=>CAT[c]).length?(a.cats||[]).filter(c=>CAT[c]):['imperdible'], cost:Math.max(0,Math.min(3,+a.cost||0)), indoor:!!a.indoor, lat:+a.lat||null, lon:+a.lon||null, len:20000,
          url:`https://www.google.com/maps/search/${encodeURIComponent(a.title+' '+stop.name)}`}));
        if(stop.lat==null && acts[0]){ stop.lat=acts[0].lat; stop.lon=acts[0].lon; }
        trip.pool[si] = acts.concat(genericFor(trip, stop));
        if(v.climate){ for(let i=0;i<=stop.nights;i++){ const d=D.add(date,i); trip.weather[d]={date:d, tmin:v.climate.tmin, tmax:v.climate.tmax, code:null, note:v.climate.note, stop:si}; } trip.weatherKind='tipico'; }
      }catch(e){ console.warn(e); trip.pool[si] = genericFor(trip, stop); }
      date = D.add(date, stop.nights);
    }
  } else {
    trip.stops.forEach((stop,si)=>{ trip.pool[si] = genericFor(trip, stop); });
  }
  log('Distribuyendo actividades día por día…');
  trip.days = schedule(trip);
  log('Armando las valijas…');
  trip.packing = buildPacking(trip);
  trip.end = end;
}

/* =========================================================
   VALIJAS
   ========================================================= */
function tripClimate(trip){
  const ws = Object.values(trip.weather||{});
  if(!ws.length) return null;
  return {tmin:Math.min(...ws.map(w=>w.tmin)), tmax:Math.max(...ws.map(w=>w.tmax)), rain:ws.some(isRainy)};
}
function isIntl(trip){ return trip.origin && trip.origin.cc && trip.stops.some(s=>s.cc && s.cc!==trip.origin.cc); }
function buildPacking(trip){
  const nights = trip.stops.reduce((a,s)=>a+s.nights,0);
  const n = Math.min(nights+1, 7); const wash = nights+1>7;
  const cl = tripClimate(trip); const I = i=>trip.interests.includes(i);
  const intl = isIntl(trip);
  const P = {};
  const add=(who,item,why='')=>{ (P[who]=P[who]||[]).push({id:uid(), item, why, on:false}); };
  trip.travelers.forEach((t,ti)=>{
    const who = t.name || ('Viajero '+(ti+1));
    add(who, intl?'Pasaporte (vigente 6 meses después del regreso)':'DNI', intl?'viaje internacional':'');
    if(t.age==='bebe'){
      add(who, `Pañales (~${(nights+1)*6} + extra)`, '6 por día aprox.');
      ['Toallitas húmedas','Cambiador portátil','Mamadera / vasito','Cochecito o mochila portabebé','Muda extra en el bolso de mano','Chupete de repuesto','Juguete o mantita de apego'].forEach(x=>add(who,x));
      add(who, `${n+2} bodies / remeras`, 'mudas extra');
    } else {
      add(who, `${n} remeras`, wash?'lavar a mitad del viaje':''); add(who, `${n} mudas de ropa interior`); add(who, `${n} pares de medias`);
      add(who, `${Math.ceil(n/3)+1} pantalones`); add(who,'Pijama'); add(who,'Calzado cómodo para caminar');
      add(who,'Cepillo de dientes y neceser');
    }
    if(cl){
      if(cl.tmin<10){ add(who,'Campera de abrigo', `mínimas de ${Math.round(cl.tmin)}°`); add(who,'Gorro, guantes y bufanda'); if(cl.tmin<3) add(who,'Primera capa térmica'); }
      else if(cl.tmin<18) add(who,'Buzo o campera liviana', `mínimas de ${Math.round(cl.tmin)}°`);
      if(cl.tmax>26){ add(who,'Shorts / ropa fresca', `máximas de ${Math.round(cl.tmax)}°`); add(who,'Gorra y anteojos de sol'); }
      if(cl.rain) add(who,'Piloto o campera impermeable','hay días con lluvia');
    }
    if(I('playa')){ add(who,'Malla'); add(who,'Ojotas'); }
    if(I('naturaleza')||I('aventura')){ if(t.age!=='bebe'){ add(who,'Zapatillas de trekking'); add(who,'Botella de agua reutilizable'); } }
    if(I('nocturna') && (t.age==='adulto'||t.age==='mayor')) add(who,'Una muda para salir de noche');
    if(t.age==='nino'){ add(who,'Libro, juego o tablet con auriculares','para traslados'); add(who,'Snacks para el viaje'); }
    if(t.age==='adolescente'){ add(who,'Auriculares y cargador'); }
    if(t.age==='adulto'||t.age==='mayor'){ add(who,'Celular y cargador'); }
    if(t.age==='mayor'){ add(who,'Anteojos de repuesto'); }
  });
  const S = 'Para todo el grupo';
  ['Botiquín básico (curitas, termómetro, gasas, alcohol en gel)','Medicación habitual de cada uno, con receta','Copias digitales de documentos y reservas','Power bank','Bolsas para ropa sucia'].forEach(x=>add(S,x));
  if(cl && cl.tmax>24) add(S,'Protector solar','sol fuerte');
  if(cl && cl.tmax>24 && (I('naturaleza')||I('playa'))) add(S,'Repelente de insectos');
  if(I('playa')) add(S,'Toallones y sombrilla');
  if(intl){ add(S,'Adaptador de enchufe universal','viaje internacional'); add(S,'Seguro de viaje impreso / en el celular'); add(S,'Tarjeta sin comisión en el exterior o algo de efectivo local'); }
  if(I('naturaleza')||I('aventura')) add(S,'Mochila de día');
  if(hasKids(trip)) add(S,'Toallitas y alcohol en gel extra');
  if(wash) add(S,'Jabón para lavar ropa en viaje','viaje de más de una semana');
  return P;
}

   PRESUPUESTO
   ========================================================= */
const MULT = {adulto:1, mayor:1, adolescente:.85, nino:.6, bebe:.1};
function budgetCalc(trip){
  const days = trip.stops.reduce((a,s)=>a+s.nights,0) || 1;
  const lv = LEVELS[trip.budget.level]; const m = trip.travelers.reduce((a,t)=>a+(MULT[t.age]||1),0);
  const total = Math.round(lv.usd*m*days);
  const split = [['Alojamiento',.4,'#14213d'],['Comidas',.25,'#e0a84f'],['Transporte local',.15,'#2a9d8f'],['Actividades',.2,'#e76f51']];
  const booked = (trip.bookings||[]).filter(b=>b.price && (!b.cur || b.cur===trip.budget.cur)).reduce((a,b)=>a+priceNum(b.price),0);
  return {days, total, split, booked};
}

function dtOf(date, time){ return new Date(`${date}T${time||'09:00'}:00`); }
function buildAlerts(trip){
  const A=[]; const add=(when,icon,title,detail,ref)=>A.push({when,icon,title,detail,ref});
  const start = dtOf(trip.start,'09:00');
  const intl = isIntl(trip);
  add(new Date(start-30*864e5),'🛂', intl?'Revisar pasaportes, visas y seguro':'Revisar documentos y reservas', intl?'Pasaportes vigentes, requisitos de entrada y seguro de viaje.':'DNI de todos y reservas confirmadas.');
  add(new Date(start-7*864e5),'🧳','Revisar el clima y empezar la valija','La lista de Valijas se ajusta al clima del viaje.');
  add(new Date(start-1*864e5),'📲','Descargar mapas sin conexión y cargar todo','Mapas offline, power bank cargado, reservas en el celular.');
  (trip.bookings||[]).forEach(b=>{
    if(!b.date) return;
    const t = dtOf(b.date, b.time); const lbl = `${BK[b.type].e} ${b.title||BK[b.type].l}${b.code?' · '+b.code:''}`;
    if(b.type==='vuelo'){
      add(new Date(t-24*36e5),'✅','Hacer el check-in online', lbl+' — la mayoría de las aerolíneas lo habilitan 24 a 48 h antes.', b.id);
      add(new Date(t-(intl?3:2)*36e5),'🚕',`Estar en el aeropuerto (${intl?'3':'2'} h antes)`, lbl+(b.from?` · sale de ${b.from}`:''), b.id);
      add(t,'✈️','Sale el vuelo', lbl+(b.from||b.to?` · ${b.from||''} → ${b.to||''}`:''), b.id);
    } else if(['tren','bus','barco'].includes(b.type)){
      add(new Date(t-45*6e4),'🚉','Estar en la estación (45 min antes)', lbl+(b.from?` · ${b.from}`:''), b.id);
      add(t,BK[b.type].e,'Sale '+BK[b.type].l.toLowerCase(), lbl+(b.from||b.to?` · ${b.from||''} → ${b.to||''}`:''), b.id);
    } else if(LODGING.includes(b.type)){
      if(b.type==='airbnb') add(new Date(dtOf(b.date,'10:00')-2*864e5),'💬','Confirmar llegada con el anfitrión', lbl+' — horario de llegada y cómo retirar las llaves.', b.id);
      add(dtOf(b.date, b.time||'15:00'),'🔑','Check-in', lbl+(b.address?` · ${b.address}`:''), b.id);
      if(b.endDate) add(dtOf(b.endDate, b.endTime||'11:00'),'🚪','Check-out', lbl, b.id);
    } else if(b.type==='auto'){
      add(t,'🚗','Retirar el auto', lbl+(b.from?` · ${b.from}`:''), b.id);
      if(b.endDate) add(dtOf(b.endDate,b.endTime||'10:00'),'⛽','Devolver el auto (con tanque lleno)', lbl, b.id);
    } else {
      add(new Date(t-2*36e5),BK[b.type].e, b.title||BK[b.type].l, (b.code?'Código '+b.code+'. ':'')+(b.notes||''), b.id);
    }
  });
  return A.sort((a,b)=>a.when-b.when);
}
function icsDate(d){ return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function buildICS(trip){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Travel Wizard//ES','CALSCALE:GREGORIAN'];
  const e = s => String(s||'').replace(/[,;\\]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  buildAlerts(trip).forEach(a=>{
    L.push('BEGIN:VEVENT','UID:'+uid()+'@travelwizard','DTSTAMP:'+icsDate(new Date()),'DTSTART:'+icsDate(a.when),'DTEND:'+icsDate(new Date(+a.when+30*6e4)),
      'SUMMARY:'+e(a.icon+' '+a.title),'DESCRIPTION:'+e(a.detail),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(a.title),'TRIGGER:-PT15M','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
async function saveFile(filename, text, mime){

  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
  catch(e){ toast('Este visor no permite descargas'); }
}

      <button class="btn" id="tourNext">Siguiente ›</button><button class="tour-alt" id="tourAlt" hidden>Ver la app primero</button></div></div>`;

function openTour(){
  store.set('tour', 1); TOUR.i=0; TOUR.n=TOUR_SL.length;
  $('#modalRoot').innerHTML=tourHTML(); navOverlay(); document.body.classList.add('touring');
  const T=$('#tour'), trk=$('#tourTrk');
  $$('[data-tdot]',T).forEach(b=>b.onclick=()=>tourGo(+b.dataset.tdot));
  $('#tourSkip').onclick=()=>closeTour();
  $('#tourNext').onclick=()=>{ if(TOUR.i<TOUR.n-1) tourGo(TOUR.i+1); else closeTour(!trips.length); };
  $('#tourAlt').onclick=()=>closeTour();
  let raf=0; trk.addEventListener('scroll',()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ const w=trk.clientWidth||1, i=Math.round(trk.scrollLeft/w); if(i!==TOUR.i) tourMark(i); }); },{passive:true});
  tourMark(0); T.focus({preventScroll:true});
}
function tourGo(i){
  const trk=$('#tourTrk'); if(!trk) return; i=Math.max(0,Math.min(TOUR.n-1,i));
  trk.scrollTo({left:i*trk.clientWidth, behavior:motionOK()?'smooth':'auto'}); tourMark(i);
}
function tourMark(i){
  const T=$('#tour'); if(!T) return; TOUR.i=i; const last=i===TOUR.n-1;
  $$('.tour-sl',T).forEach(s=>{ const on=+s.dataset.ti===i; s.classList.toggle('on',on); s.setAttribute('aria-hidden',on?'false':'true'); s.inert=!on; });
  $$('[data-tdot]',T).forEach(b=>{ if(+b.dataset.tdot===i) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  $('#tourNext').textContent = last ? (trips.length?'¡Listo, a viajar!':'✨ Armar mi primer viaje') : 'Siguiente ›';
  $('#tourAlt').hidden = !(last && !trips.length);
}
function tourCleanup(){ if($('#tour')) return; document.body.classList.remove('touring'); }
function closeTour(wizard){ closeModal(); tourCleanup(); if(wizard) startWizard(); }
addEventListener('popstate',()=>setTimeout(tourCleanup,0));
addEventListener('resize',()=>{ const trk=$('#tourTrk'); if(trk) trk.scrollTo({left:TOUR.i*trk.clientWidth}); });
addEventListener('keydown',e=>{ if(!$('#tour')) return; const k=e.key;
  if(k==='ArrowRight'){ e.preventDefault(); tourGo(TOUR.i+1); } else if(k==='ArrowLeft'){ e.preventDefault(); tourGo(TOUR.i-1); }
  else if(k==='Escape'){ e.preventDefault(); closeTour(); } });
function tourAtStart(){
  if(store.get('tour',0)) return;
  if(trips.length){ store.set('tour',1); return; }          // ya usaba la app: no lo interrumpimos
  if(!/^#?\/?$/.test(location.hash||'')) return;            // entró por un enlace directo: lo ve la próxima vez
  openTour();
}

async function refreshWeather(btn){
  const t=cur; if(!t) return; if(btn){ btn.disabled=true; btn.textContent='⏳ Buscando el clima…'; }
  let date=t.start, got=false; t.weather=t.weather||{};
  for(const [si,s] of t.stops.entries()){ const sEnd=D.add(date,s.nights);
    try{
      if(s.lat==null){ const r=(await geocode(s.name))[0]; if(r){ s.lat=r.lat; s.lon=r.lon; if(!s.cc) s.cc=r.cc; if(!s.country) s.country=r.country; } }
      if(s.lat!=null){ const w=await weatherFor(s,date,sEnd); if(w&&w.days&&w.days.length){ got=true; t.weatherKind=w.kind; w.days.forEach(d=>{ if(!t.weather[d.date]||d.date!==sEnd) t.weather[d.date]={...d,stop:si}; }); } }
    }catch(e){}
    date=sEnd; }
  if(cur!==t) return;
  if(got){ saveCur(); toast('Listo: ya tenés el clima del viaje'); if(document.querySelector('.tab.on[data-t=plan]')) renderPlan(); }
  else { toast('No pude conseguir el clima: probá de nuevo con internet'); if(btn&&btn.isConnected){ btn.disabled=false; btn.textContent='🔄 Reintentar'; } }
}

  wz = {step:0, mode:null, region:null, origin:null, originText:'', stops:[], start:D.add(D.today(),30), travelers:[{name:'',age:'adulto'}], group:null, interests:[], pace:'moderado', budget:{level:'moderado', amount:'', cur:'USD'}};

    wz.mode = wz.stops.length>1?'varios':'uno';

    // completar país y coordenadas en segundo plano si hay red
    detectLive().then(async live=>{ if(!live) return; for(const s of wz.stops){ try{ const g=(await geocode(s.name))[0]; if(g){ Object.assign(s,{name:g.name,country:g.country,cc:g.cc,admin:g.admin,lat:g.lat,lon:g.lon,manual:false}); } }catch(e){} } if(WSTEPS[wz.step]==='destino' && $('#stops')) renderWizard(); });

}

function routeKm(st){ let t=0; for(let i=1;i<st.length;i++){ if(st[i-1].lat==null||st[i].lat==null) return Infinity; t+=km(st[i-1],st[i]); } return t; }
function orderRoute(st, origin){
  if(st.some(x=>x.lat==null)){ toast('Primero elegí cada destino de la lista para saber dónde queda'); return st; }
  const o = origin&&origin.lat!=null ? origin : null;
  const tour=(arr)=>{ let t=o?km(o,arr[0]):0; for(let i=1;i<arr.length;i++) t+=km(arr[i-1],arr[i]); return t; };
  let best=null;
  for(let s0=0;s0<st.length;s0++){ const rest=st.filter((_,i)=>i!==s0), r=[st[s0]];
    while(rest.length){ const last=r[r.length-1]; let bi=0; rest.forEach((x,i)=>{ if(km(last,x)<km(last,rest[bi])) bi=i; }); r.push(rest.splice(bi,1)[0]); }
    let imp=true; while(imp){ imp=false; for(let i=0;i<r.length-1;i++) for(let j=i+1;j<r.length;j++){ const c=[...r.slice(0,i),...r.slice(i,j+1).reverse(),...r.slice(j+1)]; if(tour(c)<tour(r)-0.01){ r.splice(0,r.length,...c); imp=true; } } }
    if(!best||tour(r)<tour(best)) best=r; }
  return best;
}

function wireSuggest(inp, ul, onPick){
  let tmr, res=[];
  inp.addEventListener('input', ()=>{ clearTimeout(tmr); const q=inp.value.trim(); if(q.length<2){ul.classList.add('hidden');return;}
    tmr=setTimeout(async()=>{
      const live = await detectLive();
      if(live){ try{ res = await geocode(q); }catch(e){ res=[]; } }
      else res = [];
      const manual = {name:q, country:'', cc:'', admin:'', lat:null, lon:null, manual:true};
      const list = res.length ? res : [manual];
      ul.innerHTML = list.map((r,i)=>`<li data-i="${i}"><b>${esc(r.name)}</b> <span class="small muted">${esc([r.admin,r.country].filter(Boolean).join(', ')||(r.manual?'Usar este nombre':''))}</span></li>`).join('');
      ul.classList.remove('hidden');
      $$('li',ul).forEach(li=>li.onclick=()=>{ onPick(list[+li.dataset.i]); ul.classList.add('hidden'); });
    }, 280);
  });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const f=$('li',ul); if(f && !ul.classList.contains('hidden')) f.click(); } });
  inp.addEventListener('blur', ()=>setTimeout(()=>ul.classList.add('hidden'),200));
}

      detectLive().then(async live=>{ if(!live) return; for(const st of wz.stops){ try{ const g=(await geocode(st.name))[0]; if(g) Object.assign(st,{name:g.name,country:g.country,cc:g.cc,admin:g.admin,lat:g.lat,lon:g.lon,manual:false}); }catch(e){} } if(WSTEPS[wz.step]==='destino'&&$('#stops')) renderWizard(); }); });

    wireSuggest($('#orig'), $('#origS'), r=>{ wz.origin=r; wz.originText=r.name; $('#orig').value=r.name; });

    $('#bamt').oninput=e=>wz.budget.amount=e.target.value.replace(/[^\d.,]/g,'');
    $('#bcur').onchange=e=>wz.budget.cur=e.target.value;
  }
}

      facts.splice(fi, 0, ...nw); }).catch(()=>{}) ); });

/* Modo presentación (mejora 17): pantalla completa, una diapositiva por día con fotos grandes, para mostrar el viaje a la familia.
   Vive dentro de #modalRoot (así «atrás» del celular la cierra) y no guarda nada. */
const PRES = {i:0, n:0, timer:null, dur:7000, play:false};
function presSlides(t){
  const nights=t.stops.reduce((a,s)=>a+s.nights,0), end=t.end||D.add(t.start,nights);
  const cover=(t.stops.find(s=>s.img)||{}).img||'';
  const sl=[{k:'cover', img:cover}];
  t.days.forEach((d,di)=>{
    const s=t.stops[d.stop]||{name:''}, pool=(t.pool&&t.pool[d.stop])||[];
    const acts=(d.items||[]).map(x=>({x, p:pool.find(p=>p.id===x.ref)})).filter(a=>a.p);
    const ph=acts.find(a=>a.p.img);
    sl.push({k:'day', d, di, s, acts, img:(ph&&ph.p.img)||s.img||'', w:t.weather&&t.weather[d.date], bks:(t.bookings||[]).filter(b=>b.date===d.date)});
  });
  sl.push({k:'end', img:cover});
  return {sl, nights, end};
}
function presHTML(t){
  const {sl,nights,end}=presSlides(t);
  const bg=img=>img?`<div class="pbg ph" data-bg="${esc(img)}"></div>`:`<div class="pbg"></div>`;
  const body=sl.map((x,i)=>{
    if(x.k==='cover') return `<section class="ps pcover" data-pi="${i}" aria-roledescription="diapositiva">${bg(x.img)}<div class="pveil"></div>${x.img?'':'<div class="pemo">🧭</div>'}
      <div class="pc"><div class="pey">${D.nice(t.start,{day:'numeric',month:'long'})} → ${D.nice(end,{day:'numeric',month:'long',year:'numeric'})}</div><h2>${esc(t.name)}</h2>
      <div class="pdt">${t.days.length} días · ${nights} noches · ${t.stops.map(s=>esc(s.name)).join(' · ')}</div>
      <div class="ppills">${t.travelers.map(v=>`<span>${esc(v.name)}</span>`).join('')}</div></div></section>`;
    if(x.k==='end') return `<section class="ps pend" data-pi="${i}" aria-roledescription="diapositiva">${bg(x.img)}<div class="pveil"></div>
      <div class="pc"><div class="pey">Fin del recorrido</div><h2>¡Buen viaje!</h2><div class="pdt">${esc(t.name)} · ${t.days.length} días para disfrutar juntos</div>
      <div class="pact"><button data-pgo="0">↺ Ver de nuevo</button><button class="gh" data-pclose>Cerrar</button></div></div></section>`;
    const {d,di,s,acts,w,bks}=x, title=dayTitleOf(t,d);
    const rows=[...bks.map(b=>`<li><span class="pt">${BK[b.type].e}</span><span><b>${esc(b.title||BK[b.type].l)}</b><small>${esc([b.time,b.from&&b.to?`${b.from} → ${b.to}`:''].filter(Boolean).join(' · '))}</small></span></li>`),
      ...acts.map(({x:it,p})=>`<li><span class="pt" ${p.img?`data-bg="${esc(p.img)}"`:''}>${p.img?'':(CAT[p.cats[0]]||CAT.imperdible).e}</span><span><b>${esc(p.title)}${it.done?' <span class="ok">✓</span>':''}</b><small>${esc([it.time,(CAT[p.cats[0]]||CAT.imperdible).l].filter(Boolean).join(' · '))}</small></span></li>`)];
    const max=window.innerHeight<700?3:5;
    return `<section class="ps" data-pi="${i}" aria-roledescription="diapositiva">${bg(x.img)}<div class="pveil"></div>${x.img?'':`<div class="pemo">${d.kind==='traslado'?'🧭':d.kind==='llegada'?'🛬':d.kind==='regreso'?'🏡':'✨'}</div>`}
      <div class="pc"><div class="pdn">${String(di+1).padStart(2,'0')}</div><h2>${esc(title)}</h2>
      <div class="pdt">${D.nice(d.date,{weekday:'long',day:'numeric',month:'long'})}${w?`<span class="pwx">${wxEmoji(w.code)} ${Math.round(w.tmax)}° / ${Math.round(w.tmin)}°</span>`:''}</div>
      ${rows.length?`<ul class="pl">${rows.slice(0,max).join('')}</ul>${rows.length>max?`<div class="pmore">y ${rows.length-max} más…</div>`:''}`:`<div class="pmore">Día libre para descansar o improvisar.</div>`}</div></section>`;
  }).join('');
  return {n:sl.length, html:`<div class="pres" id="pres" role="dialog" aria-modal="true" aria-label="Presentación de ${esc(t.name)}" tabindex="-1">${body}
    <button class="ptap pv" data-pstep="-1" aria-label="Anterior"></button><button class="ptap nx" data-pstep="1" aria-label="Siguiente"></button>
    <button class="pnav pv" data-pstep="-1" aria-label="Anterior">‹</button><button class="pnav nx" data-pstep="1" aria-label="Siguiente">›</button>
    <div class="ptop"><div class="pbars">${sl.map((x,i)=>`<button data-pgo="${i}" aria-label="${i===0?'Portada':x.k==='end'?'Final':'Día '+(x.di+1)}"><i><b></b></i></button>`).join('')}</div>

    <div class="phint" id="pHint">Deslizá o tocá los costados para pasar de día</div></div>`};

function openPres(start){
  if(!cur) return; const {n,html}=presHTML(cur);
  $('#modalRoot').innerHTML=html; navOverlay(); document.body.classList.add('presing');
  const P=$('#pres'); PRES.n=n; PRES.play=false; P.style.setProperty('--pdur',PRES.dur/1000+'s');
  $$('[data-pstep]',P).forEach(b=>b.onclick=e=>{ e.stopPropagation(); presGo(PRES.i+ +b.dataset.pstep, true); });
  $$('[data-pgo]',P).forEach(b=>b.onclick=e=>{ e.stopPropagation(); presGo(+b.dataset.pgo, true); });
  $$('[data-pclose]',P).forEach(b=>b.onclick=closePres);
  $('#pPlay').onclick=()=>presPlay(!PRES.play);
  if($('#pFull')) $('#pFull').onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():P.requestFullscreen().catch(()=>{}); }catch(e){} };
  let x0=null,y0=0; P.addEventListener('pointerdown',e=>{ x0=e.clientX; y0=e.clientY; PRES.swiped=0; });
  P.addEventListener('pointerup',e=>{ if(x0==null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){ e.preventDefault(); PRES.swiped=1; presGo(PRES.i+(dx<0?1:-1), true); } });
  P.addEventListener('click',e=>{ if(PRES.swiped){ PRES.swiped=0; e.stopPropagation(); e.preventDefault(); } }, true);
  presGo(start||0); P.focus({preventScroll:true});
  try{ if(!matchMedia('(pointer:fine)').matches && P.requestFullscreen && document.fullscreenEnabled) P.requestFullscreen().catch(()=>{}); }catch(e){}
  const h=$('#pHint'); h.classList.add('on'); setTimeout(()=>h&&h.classList.remove('on'),2600);
}
function presGo(i, user){
  const P=$('#pres'); if(!P) return; i=Math.max(0,Math.min(PRES.n-1,i)); PRES.i=i;
  $$('.ps',P).forEach(s=>{ const k=+s.dataset.pi; s.classList.toggle('on',k===i); s.setAttribute('aria-hidden',k===i?'false':'true');
    if(Math.abs(k-i)<=1) $$('[data-bg]',s).forEach(e=>{ e.style.backgroundImage=`url('${e.dataset.bg}')`; e.removeAttribute('data-bg'); }); });
  $$('.pbars button',P).forEach((b,k)=>{ b.className=k<i?'dn':k===i?'cu':''; });
  const cu=$('.pbars .cu b',P); if(cu){ cu.style.animation='none'; void cu.offsetWidth; cu.style.animation=''; }
  const c=$('#pCount'); if(c) c.textContent = i===0?`${cur.name}`: i===PRES.n-1?'Final':`Día ${i} de ${PRES.n-2}`;
  if(PRES.play){ clearTimeout(PRES.timer); if(i>=PRES.n-1) presPlay(false); else PRES.timer=setTimeout(()=>presGo(PRES.i+1),PRES.dur); }
}
function presPlay(on){
  const P=$('#pres'); if(!P) return; PRES.play=on; clearTimeout(PRES.timer); P.classList.toggle('play',on);
  const b=$('#pPlay'); b.textContent=on?'⏸':'▶'; b.setAttribute('aria-label',on?'Pausar':'Pasar solo');
  if(on){ if(PRES.i>=PRES.n-1) PRES.i=0; presGo(PRES.i); }
}
function presCleanup(){ if($('#pres')) return; clearTimeout(PRES.timer); PRES.play=false; document.body.classList.remove('presing'); try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){} }
function closePres(){ clearTimeout(PRES.timer); closeModal(); presCleanup(); }
addEventListener('popstate',()=>setTimeout(presCleanup,0));
addEventListener('keydown',e=>{ const P=$('#pres'); if(!P) return;
  const k=e.key; if(k==='ArrowRight'||k==='PageDown'||k===' '){ e.preventDefault(); presGo(PRES.i+1,true); } else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); presGo(PRES.i-1,true); }
  else if(k==='Home'){ e.preventDefault(); presGo(0,true); } else if(k==='End'){ e.preventDefault(); presGo(PRES.n-1,true); } else if(k==='Escape'){ e.preventDefault(); closePres(); }
  else if(k==='p'||k==='P'){ presPlay(!PRES.play); } });

function sayPhrase(code){ const [lk,i]=code.split(':'); const L_=LANGS[lk]; if(!L_||!('speechSynthesis' in window)){ toast('Este teléfono no puede leer en voz alta'); return; }
  const txt=L_.f[+i][1].replace(/\s*\([^)]*\)\s*/g,' ').split(' / ')[0].trim(); const u=new SpeechSynthesisUtterance(txt); u.lang=L_.sp; u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(L_.sp.slice(0,2))); if(v) u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u); }

/* varias reservas en un mismo mail (ida y vuelta, varios tramos) */
const SEG_HEAD=/^[ \t]*(?:[-*•·>|#]+[ \t]*)?(?:[←-⯿\u{1F300}-\u{1FAFF}️]+[ \t]*)?(?:vuelo de (?:ida|vuelta|regreso)|tramo de (?:ida|vuelta|regreso)|ida|vuelta|regreso|retorno|volta|outbound(?: flight)?|inbound(?: flight)?|return flight|departure flight|tramo[ \t]*\d+|segmento[ \t]*\d+|segment[ \t]*\d+|trecho[ \t]*\d+|leg[ \t]*\d+|vuelo[ \t]*\d[ \t]*(?:de|of)[ \t]*\d|flight[ \t]*\d[ \t]*of[ \t]*\d)\b(?![ \t]*(?:y|e|and|&)[ \t]*(?:vuelta|volta|return))/gimu;
const FLNUM=/\b(?!(?:EUR|USD|ARS|BRL|CLP)\b)([A-Z][A-Z0-9]|[A-Z0-9][A-Z])[ ]?(\d{2,4})\b/g;
function segmentBlocks(txt, type){
  if(!TRANSPORT.includes(type)) return [];
  const heads=[...txt.matchAll(SEG_HEAD)].map(m=>m.index);
  if(heads.length>=2) return heads.map((h,i)=>txt.slice(h, heads[i+1]??txt.length));
  const hasRoute=t=>/\b[A-Z]{3}\s*(?:→|->|–|—|>)\s*[A-Z]{3}\b|\([A-Z]{3}\)\s*(?:→|->|–|—|-|>|a|to)\s*[^\n]*\([A-Z]{3}\)/.test(t);
  const paras=txt.split(/\n[ \t]*\n/).filter(p=>findDates(p).length&&hasRoute(p));
  if(paras.length>=2) return paras;
  const lines=txt.split('\n'); const idx=lines.map((l,i)=>findDates(l).length&&hasRoute(l)?i:-1).filter(i=>i>=0);
  if(idx.length>=2) return idx.map((i,k)=>lines.slice(i, Math.min(idx[k+1]??lines.length, i+3)).join('\n'));

}
function parseBookingsText(txt, trip){
  txt=String(txt||'').replace(/\r/g,''); const g=parseBookingText(txt, trip);
  const blocks=segmentBlocks(txt, g.type); if(blocks.length<2) return [g];

    if(!s.title||!/\s/.test(s.title)){ const fl=[...bl.matchAll(FLNUM)].map(m=>m[1]+m[2]).find(x=>/\d/.test(x)&&!/^\d+$/.test(x));

    Object.keys(s).forEach(k=>{ if(s[k]==null||s[k]==='') delete s[k]; }); return s; }).filter(s=>s.date);
  const uniq=segs.filter((s,i)=>segs.findIndex(o=>o.date===s.date&&o.time===s.time&&o.from===s.from)===i);

  if(g.price){ uniq[0].price=g.price; if(g.mailCur) uniq[0].mailCur=g.mailCur; }
  return uniq;
}
/* PDF de la confirmación → texto (pdf.js desde cdnjs, carga diferida; sin red no hay lectura pero sí adjunto) */
const PDFJS={v4:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/', v3:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/'};
let pdfLibP=null;
function loadPdfLib(){
  if(pdfLibP) return pdfLibP;
  pdfLibP=(async()=>{
    try{ const m=await import(PDFJS.v4+'pdf.min.mjs'); m.GlobalWorkerOptions.workerSrc=PDFJS.v4+'pdf.worker.min.mjs'; return m; }
    catch(e){ console.warn('pdf.js 4', e);
      await new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=PDFJS.v3+'pdf.min.js'; sc.onload=res; sc.onerror=()=>rej(new Error('pdf.js no disponible')); document.head.appendChild(sc); });
      const L=window.pdfjsLib; if(!L) throw new Error('pdf.js no disponible'); L.GlobalWorkerOptions.workerSrc=PDFJS.v3+'pdf.worker.min.js'; return L; }
  })();
  pdfLibP.catch(()=>{ pdfLibP=null; });
  return pdfLibP;
}
async function pdfText(file){
  let L; try{ L=await loadPdfLib(); }catch(e){ const er=new Error('sin lector de PDF'); er.noLib=true; throw er; }
  const doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[], n=Math.min(doc.numPages,8);
  for(let p=1;p<=n;p++){
    const tc=await (await doc.getPage(p)).getTextContent(); const lines=[]; let line='', lastY=null, lastX=null;
    tc.items.forEach(it=>{ if(typeof it.str!=='string') return; const x=it.transform[4], y=it.transform[5];
      if(lastY!==null && Math.abs(y-lastY)>2){ lines.push(line); line=''; lastX=null; }
      if(line && lastX!==null && x-lastX>1 && !/\s$/.test(line) && !/^\s/.test(it.str)) line+=' ';
      line+=it.str; lastY=y; lastX=x+(it.width||0);
      if(it.hasEOL){ lines.push(line); line=''; lastY=null; lastX=null; } });
    if(line) lines.push(line);
    pages.push(lines.map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n'));
  }
  try{ doc.destroy(); }catch(e){}
  return {text:pages.join('\n\n'), pages:n};
}

async function claudeBooking(txt, trip){
  const prompt = `Extraé los datos de esta confirmación de reserva de viaje. Devolvé SOLO JSON válido, sin texto extra.
Si el mail tiene varios tramos o reservas (ida y vuelta, escalas con otro vuelo, varios hoteles), devolvé una por cada uno, en orden.

Texto:
"""${txt.slice(0,6000)}"""`;

function normClaudeBk(v){

  ['date','endDate'].forEach(k=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(v[k]||'')) out[k]=v[k]; });

function searchRun(q){
  const toks=norm(q).split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const out=[];
  searchIndex().forEach(e=>{ const T=norm(e.title), H=T+' '+norm(e.sub)+' '+norm(e.extra);
    if(!toks.every(k=>H.includes(k))) return;
    let sc=0; toks.forEach(k=>{ if(T.startsWith(k)) sc+=6; else if(new RegExp('(^|[^a-z0-9])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(T)) sc+=4; else if(T.includes(k)) sc+=2; });
    sc+={'Viajes':3,'Reservas':2,'Días':1}[e.g]||0; out.push({...e, sc}); });
  return out.sort((a,b)=>b.sc-a.sc);
}
function markHit(txt,q){ let h=esc(txt); const toks=norm(q).split(/\s+/).filter(k=>k.length>1); if(!toks.length) return h;
  const n=norm(txt); const marks=new Array(txt.length).fill(false);
  if(n.length===txt.length) toks.forEach(k=>{ let i=n.indexOf(k); while(i>=0){ for(let j=i;j<i+k.length;j++) marks[j]=true; i=n.indexOf(k,i+k.length); } });
  if(!marks.some(Boolean)) return h;
  let o='', on=false; [...txt].forEach((c,i)=>{ if(marks[i]&&!on){ o+='<mark>'; on=true; } if(!marks[i]&&on){ o+='</mark>'; on=false; } o+=esc(c); }); return o+(on?'</mark>':''); }

function nightsOf(t){ return t.stops.reduce((a,s)=>a+s.nights,0); }
function tripStatus(t){
  const today=D.today(), end=t.end||D.add(t.start,nightsOf(t));
  const d=D.diff(today,t.start);
  if(d>0) return {k:'next', d, label: d===1?'¡Sale mañana!':`Faltan ${d} días`};
  if(D.diff(today,end)>=0) return {k:'now', d:0, label:`En viaje · día ${D.diff(t.start,today)+1}`};
  return {k:'past', d, label:'Terminado'};
}
function tripCardHTML(t){
  const st=tripStatus(t); const img=t.stops[0]&&t.stops[0].img;
  return `<div class="card tripcard" data-id="${t.id}" style="${accVars(t)}">
    <div class="ph" style="${img?`background-image:url('${esc(img)}')`:''}">${img?'':'🧭'}</div>
    <div class="grow"><h3>${esc(t.name)}</h3><div class="small muted">${D.nice(t.start,{day:'numeric',month:'short',year:'numeric'})} · ${nightsOf(t)} noches · ${t.travelers.length} ${t.travelers.length===1?'viajero':'viajeros'}</div>
    <span class="when-pill ${st.k==='now'?'now':st.k==='past'?'past':''}">${st.label}</span></div>
    <span class="muted">›</span></div>`;
}
function tripGroups(){
  const withSt=trips.map(t=>({t,st:tripStatus(t)}));
  const act=withSt.filter(x=>x.st.k!=='past').sort((a,b)=>a.t.start>b.t.start?1:-1);
  const past=withSt.filter(x=>x.st.k==='past').sort((a,b)=>a.t.start<b.t.start?1:-1);
  return (act.length?`${past.length?'<div class="tripgroup">Próximos</div>':''}${act.map(x=>tripCardHTML(x.t)).join('')}`:'')
       + (past.length?`<div class="tripgroup">Viajes pasados</div>${past.map(x=>tripCardHTML(x.t)).join('')}`:'');
}

/* Resumen del viaje (mejora 4) */
function summaryCard(t){
  const st=tripStatus(t);
  const nextA=buildAlerts(t).find(a=>+a.when>Date.now());
  const pk=Object.values(t.packing||{}).flat(); const pkOn=pk.filter(x=>x.on).length; const pkPct=pk.length?Math.round(pkOn/pk.length*100):0;
  const b=budgetCalc(t); const nb=(t.bookings||[]).length;
  const lodgNights=new Set(); (t.bookings||[]).filter(x=>LODGING.includes(x.type)&&x.date).forEach(x=>{ const e=x.endDate||D.add(x.date,1); for(let d=x.date; d<e && D.diff(d,e)>0 && lodgNights.size<400; d=D.add(d,1)) lodgNights.add(d); });
  const nights=nightsOf(t); const covered=Math.min(nights,[...lodgNights].filter(d=>d>=t.start&&d<D.add(t.start,nights)).length);
  const cdBig = st.k==='next' ? `<b>${st.d}</b><span>${st.d===1?'día':'días'}</span>` : st.k==='now' ? `<b>${D.diff(t.start,D.today())+1}</b><span>de ${nights+1}</span>` : `<b>✓</b><span>viajado</span>`;

async function applyTripEdit(e){

  const travCh = JSON.stringify(e.travelers)!==JSON.stringify(t.travelers);
  const planCh = datesCh || e.pace!==t.pace || e.budget.level!==t.budget.level || e.interests.join()!==t.interests.join();
  const accCh = e.accent!==(t.accent||'clasico'); t.accent=e.accent; t.name=e.name; t.start=e.start; t.stops.forEach((s,i)=>s.nights=e.stops[i].nights); t.travelers=e.travelers.map((x,i)=>({name:x.name.trim()||'Viajero '+(i+1),age:x.age}));
  t.interests=e.interests; t.pace=e.pace; t.budget=e.budget; t.end=D.add(t.start,nightsOf(t));
  closeModal();
  if(datesCh && LIVE && t.source==='web'){
    toast('Actualizando el clima…');
    t.weather={}; let date=t.start;
    for(const [si,stop] of t.stops.entries()){ const sEnd=D.add(date,stop.nights); if(stop.lat!=null){ const w=await weatherFor(stop,date,sEnd); if(w){ t.weatherKind=w.kind; w.days.forEach(d=>{ if(!t.weather[d.date]||d.date!==sEnd) t.weather[d.date]={...d,stop:si}; }); } } date=sEnd; }
  } else if(datesCh && t.weatherKind==='tipico'){
    const old=Object.values(t.weather||{}); const byStop={}; old.forEach(w=>{ byStop[w.stop]=w; }); t.weather={}; let date=t.start;
    t.stops.forEach((s,si)=>{ const w=byStop[si]; if(w) for(let i=0;i<=s.nights;i++){ const d=D.add(date,i); t.weather[d]={...w,date:d}; } date=D.add(date,s.nights); });
  } else if(datesCh){ t.weather={}; }
  if(planCh) t.days=schedule(t);
  if(travCh || datesCh){ const old=t.packing||{}; const nu=buildPacking(t); Object.entries(nu).forEach(([who,list])=>{ const prev=old[who]||[]; list.forEach(x=>{ const m=prev.find(y=>y.item===x.item); if(m) x.on=m.on; }); const extra=prev.filter(y=>!list.some(x=>x.item===y.item) && !y.auto && y.custom); list.push(...extra); }); t.packing=nu; }
  saveCur(); renderTrip(); scheduleNotifs(t);
  toast(planCh?'Viaje actualizado e itinerario rearmado':accCh?`Listo: el viaje ahora es ${ACCENTS[e.accent].n}`:'Viaje actualizado');
}

/* ---------- navegación por la URL (mejora 11) ----------
   #/ inicio · #/nuevo/N paso del asistente · #/viaje/<id>/<pestaña> · #/novedades · #/marcas
   Las ventanas y el buscador suman una entrada (ov) para que «atrás» las cierre.
   Volver a la pantalla anterior desde la app usa history.back() para no apilar entradas. */
const NAV={on:false, routing:false, backing:false, after:null, view:'', t:0};
const TABS=['plan','reservas','valijas','plata','alertas'];
try{ NAV.on=!!(window.history&&history.pushState&&history.replaceState); }catch(e){}
function navTry(fn){ if(!NAV.on) return false; try{ fn(); return true; }catch(e){ NAV.on=false; return false; } }
function hstate(){ try{ return history.state||{}; }catch(e){ return {}; } }
function hereHash(){ const h=location.hash; return h&&h!=='#'?h:'#/'; }
function tripOfHash(h){ const m=/^#\/viaje\/([^/]+)(?:\/([a-z]+))?$/.exec(h||''); return m?{id:decodeURIComponent(m[1]), tab:m[2]||'plan'}:null; }
function navBack(n, after){
  NAV.backing=true; NAV.after=after||null; clearTimeout(NAV.t);
  if(!navTry(()=>history.go(-n))){ NAV.backing=false; NAV.after=null; return; }
  NAV.t=setTimeout(()=>{ if(NAV.backing) navSettle(); },900);   // por si el navegador no avisa
}
function navSettle(){
  clearTimeout(NAV.t); NAV.backing=false; const a=NAV.after; NAV.after=null;
  if(a&&a.url) syncURL(a.url);
  if(a&&a.ov&&$('#modalRoot').innerHTML){ if(NAV.backing) NAV.after={...(NAV.after||{}), ov:true}; else navOverlay(); }
  if(!(a&&a.url) && !NAV.backing && NAV.view && hereHash()!==NAV.view) route();
}
function syncURL(h){
  NAV.view=h;
  if(!NAV.on||NAV.routing) return;
  if(NAV.backing){ NAV.after={...(NAV.after||{}), url:h}; return; }
  const here=hereHash(), st=hstate();
  if(here===h) return;
  if(st.ov){ navTry(()=>history.replaceState({tw:1, prev:here}, '', h)); return; }
  if(st.prev===h) return navBack(1);                                   // es la pantalla de antes: atrás de verdad
  const a=tripOfHash(here), b=tripOfHash(h);
  if(a&&b&&a.id===b.id&&a.tab!=='plan'){ navTry(()=>history.replaceState({tw:1, prev:st.prev}, '', h)); return; } // entre pestañas: atrás vuelve al itinerario
  const inWz=/^#\/nuevo/.test(here), toWz=/^#\/nuevo/.test(h);
  if(inWz&&!toWz&&st.wz>0) return navBack(st.wz, {url:h});           // al salir del asistente se sacan sus pasos
  navTry(()=>history.pushState({tw:1, prev:here, wz: toWz?(inWz?(st.wz||0)+1:1):0}, '', h));
}
function navOverlay(){
  if(!NAV.on||NAV.routing) return;
  if(NAV.backing){ NAV.after={...(NAV.after||{}), ov:true}; return; }
  const st=hstate(); if(st.ov) return;
  navTry(()=>history.pushState({tw:1, ov:1, prev:st.prev, wz:st.wz}, '', hereHash()));
}
function navOverlayClosed(){
  if(!NAV.on) return;
  if(NAV.backing){ if(NAV.after) NAV.after.ov=false; return; }
  if(hstate().ov) navBack(1);
}
function route(){
  const h=hereHash(); let m; NAV.routing=true;
  try{
    if((m=/^#\/nuevo(?:\/(\d+))?$/.exec(h))){ if(wz){ wz.step=Math.max(0,Math.min(WSTEPS.length-1,+(m[1]||0))); renderWizard(); } else startWizard(); }
    else if((m=tripOfHash(h))){ const t=trips.find(x=>x.id===m.id);
      if(!t){ cur=null; renderHome(); }
      else { const chg=!cur||cur.id!==t.id; cur=t; tab=TABS.includes(m.tab)?m.tab:'plan'; renderTrip(); if(chg) scheduleNotifs(cur); } }
    else if(h==='#/novedades') renderNews();
    else if(h==='#/marcas') renderBrands();
    else { cur=null; renderHome(); }
  }finally{ NAV.routing=false; }
  if(NAV.view&&hereHash()!==NAV.view){ const st=hstate(); navTry(()=>history.replaceState({tw:1, prev:st.prev}, '', NAV.view)); }
}
addEventListener('popstate',()=>{
  if(!NAV.on) return;
  if(NAV.backing) return navSettle();
  if($('#modalRoot').innerHTML){ $('#modalRoot').innerHTML=''; if(cur&&document.body.classList.contains('intrip')) applyAccent(cur.accent); if(hereHash()===NAV.view) return; }   // atrás cierra la ventana
  if(hstate().ov&&hereHash()===NAV.view) return;
  route();
});

/* ---------- transiciones suaves (mejora 12) ----------
   Solo animan al CAMBIAR de pantalla, de paso o de pestaña: si la misma vista se vuelve a dibujar
   (tildar «hecho», borrar una reserva…) no se mueve nada. Respeta «reducir movimiento». */
const MOTION={last:null, prevPct:0};
const STG_ITEMS='.day,.bk,.kpi,.wxd,.tripcard,.idea,.levels>*,.card.pk,.card.money,.al,.ideas>*';
function motionOK(){ try{ return !matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return true; } }
function animOnce(el, cls, i, dir){
  el.classList.add(cls); if(i!=null) el.style.setProperty('--i', i); if(dir!=null) el.style.setProperty('--dir', dir);
  const end=e=>{ if(e.target!==el) return; el.classList.remove(cls); el.style.removeProperty('--i'); if(dir!=null) el.style.removeProperty('--dir'); el.removeEventListener('animationend',end); el.removeEventListener('animationcancel',end); };
  el.addEventListener('animationend',end); el.addEventListener('animationcancel',end);
}
function stagger(root, start){
  let i=start||0; if(!root) return i; const lim=innerHeight*1.4;
  const tag=el=>{ if(el.getBoundingClientRect().top>lim||!el.getClientRects().length) return; animOnce(el,'stg',Math.min(i++,12)); };
  for(const ch of [...root.children]){
    if(ch.matches('input,script,style,.hidden')) continue;
    const items=ch.matches(STG_ITEMS)?[]:[...ch.querySelectorAll(STG_ITEMS)].filter(x=>!x.parentElement.closest(STG_ITEMS));
    if(items.length) items.forEach(tag); else tag(ch);
  }
  return i;
}
function motionAfter(key){
  const prev=MOTION.last; MOTION.last=key;
  if(prev===key||!motionOK()) return;
  try{
    const pt=tripOfHash(prev||''), nt=tripOfHash(key);
    if(nt){
      const body=$('#tabBody'); if(!body) return;
      if(pt&&pt.id===nt.id){                                   // misma vista de viaje, otra pestaña
        const a=TABS.indexOf(pt.tab), b=TABS.indexOf(nt.tab), ind=$('.tind');
        if(ind&&a>=0){ ind.style.setProperty('--ti',a); ind.getBoundingClientRect(); ind.style.setProperty('--ti',b); }
        animOnce(body,'tb-in',null,Math.sign(b-a)||0); stagger(body,1);
      } else { const h=$('.thero'); if(h) animOnce(h,'scr-in'); stagger(body,1); }
      return;
    }
    const wzm=/^#\/nuevo\/(\d+)/.exec(key), pwz=/^#\/nuevo\/(\d+)/.exec(prev||'');
    if(wzm){
      const w=$('.wz'); if(!w) return; const step=+wzm[1], dir=pwz?Math.sign(step-(+pwz[1])):1;
      const bar=$('.prog i'); if(bar&&pwz){ const nw=bar.style.width; bar.style.width=MOTION.prevPct+'%'; bar.getBoundingClientRect(); bar.style.width=nw; }
      let i=0; [...w.children].forEach(ch=>{ if(!ch.matches('.prog,.stepn,.wznav')) animOnce(ch,'wzs',Math.min(i++,8),dir); });
      return;
    }
    const main=$('#app > .wrap'); if(main) stagger(main,0);    // inicio, novedades, para marcas
  }catch(e){}
}
{ const w=(f,h)=>function(){ const r=f.apply(this,arguments); try{ motionAfter(h()); if(wz) MOTION.prevPct=(wz.step+1)/WSTEPS.length*100; }catch(e){} return r; };
  renderHome=w(renderHome,()=>'#/');
  renderWizard=w(renderWizard,()=>'#/nuevo/'+(wz?wz.step:0));
  renderTrip=w(renderTrip,()=>'#/viaje/'+encodeURIComponent(cur.id)+'/'+tab);
  renderNews=w(renderNews,()=>'#/novedades');
  renderBrands=w(renderBrands,()=>'#/marcas'); }

/* ---------- inicio ---------- */
setIcons();
{ const st=hstate(); if(st.ov) navTry(()=>history.replaceState({tw:1, prev:st.prev, wz:st.wz}, '', hereHash())); }
route();
try{ tourAtStart(); }catch(e){}
detectLive();
initClaude();
</script>
